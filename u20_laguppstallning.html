}
var check=game.checkedAt||data.scheduleCheckedAt;
byId('updated').textContent=(game.lineup?'Lag kontrollerat ':'Spelschema kontrollerat ')+new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(check));
var age=Date.now()-new Date(data.scheduleCheckedAt).getTime();
if(game.status==='stale')message('Hämtningen misslyckades. Visar senast hämtad laguppställning för denna match.');
else message('');
byId('match-select').value=demo?'demo':game.date;
size();
renderPresentation();
}
function updateOptions(){var select=clear('match-select');data.games.forEach(function(g){var option=el('option',null,g.date+' · '+g.away);option.value=g.date;select.appendChild(option)});var option=el('option',null,'Test · Sollentuna – Djurgården · 29 september');option.value='demo';select.appendChild(option)}
async function load(){if(busy)return;busy=true;try{var response=await fetch(dataUrl+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);var fresh=await response.json();if(!Array.isArray(fresh.games)||!fresh.scheduleCheckedAt)throw new Error('Ogiltiga matchuppgifter');data=fresh;updateOptions();render()}catch(error){message(data?'Ingen anslutning till matchuppgifterna. Visar senast hämtade uppgifter.':'Matchuppgifterna kunde inte hämtas. Försöker igen automatiskt.');if(!data)empty('Väntar på matchuppgifter','Kontrollera internetanslutningen. Sidan försöker igen automatiskt.')}finally{busy=false}}
function updateAddress(){var url=new URL(location.href);url.searchParams.delete('demo');url.searchParams.delete('date');url.searchParams.delete('info');if(demo)url.searchParams.set('demo','1');else if(selected!=='auto')url.searchParams.set('date',selected);if(infoMode)url.searchParams.set('info','1');history.replaceState(null,'',url)}
byId('match-select').addEventListener('change',function(){demo=this.value==='demo';selected=demo?'auto':this.value;updateAddress();render()});
byId('auto').addEventListener('click',function(){demo=false;selected='auto';updateAddress();render()});
byId('demo').addEventListener('click',function(){demo=true;selected='auto';updateAddress();render()});
byId('fullscreen').addEventListener('click',function(){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen()});
byId('presentation-toggle').addEventListener('click',function(){infoMode=!infoMode;updateAddress();renderPresentation()});
byId('profile-prev').addEventListener('click',function(){profileIndex--;renderPresentation()});
byId('profile-next').addEventListener('click',function(){profileIndex++;renderPresentation()});
function loadPlayerInfo(){fetch(base+'u20/spelarinfo.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Player data unavailable');return r.json()}).then(function(info){playerInfo=info;if(data)renderPresentation()}).catch(function(){if(infoMode&&data)renderPresentation()})}
loadPlayerInfo();setInterval(loadPlayerInfo,120000);setInterval(function(){if(infoMode){profileIndex++;renderPresentation()}},4000);
fetch(base+'u20/spelarfoton.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).then(function(map){photos=map;if(data)render()}).catch(function(){});
load();setInterval(load,120000);
})();
</script>
