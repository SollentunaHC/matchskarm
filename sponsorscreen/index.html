<script>
  const grid = document.getElementById("grid");
  const SLOTS = 6;
  const INTERVAL = 15000;

  const API_URL = "https://api.github.com/repos/sollentunahc/sponsorscreen/contents/logos";

  async function loadLogos() {
    const response = await fetch(API_URL);
    const files = await response.json();

    return files
      .filter(f => f.type === "file")
      .filter(f => /\.(png|jpg|jpeg|svg|webp)$/i.test(f.name))
      .map(f => f.download_url);
  }

  function shuffle(arr) {
    return arr
      .map(x => ({ x, r: Math.random() }))
      .sort((a, b) => a.r - b.r)
      .map(o => o.x);
  }

  function render(urls) {
    grid.style.opacity = 0;

    setTimeout(() => {
      grid.innerHTML = "";
      const selected = shuffle(urls).slice(0, SLOTS);

      selected.forEach(url => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = url;

        card.appendChild(img);
        grid.appendChild(card);
      });

      grid.style.opacity = 1;
    }, 600);
  }

  async function start() {
    const logos = await loadLogos();
    render(logos);
    setInterval(() => render(logos), INTERVAL);
  }

  start();
</script>
