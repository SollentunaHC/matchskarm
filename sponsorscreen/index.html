<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sponsorer</title>
  <style>
    body {
      margin: 0;
      background: #0f1218;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      flex: 0 0 12%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 32px;
      padding: 32px 48px;
      box-sizing: border-box;
      transition: opacity 0.6s ease;
    }

    .card {
      background: #1a1f2b;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="header">Tack till våra sponsorer</div>

  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById("grid");
    const SLOTS = 6;
    const INTERVAL = 15000;

    const API_URL = "https://api.github.com/repos/<USER>/<REPO>/contents/sponsorscreen/logos?ref=<BRANCH>";

    async function loadLogos() {
      const response = await fetch(API_URL);
      const files = await response.json();

      // Filtrera bort allt som inte är bildfiler
      return files
        .filter(f => f.type === "file")
        .filter(f => /\.(png|jpg|jpeg|svg|webp)$/i.test(f.name))
        .map(f => f.download_url);
    }

    function shuffle(arr) {
      return arr
        .map(x => ({ x, r: Math.random() }))
        .sort((a, b) => a.r - b.r)
        .map(o => o.x);
    }

    function render(urls) {
      grid.style.opacity = 0;

      setTimeout(() => {
        grid.innerHTML = "";
        const selected = shuffle(urls).slice(0, SLOTS);

        selected.forEach(url => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = url;

          card.appendChild(img);
          grid.appendChild(card);
        });

        grid.style.opacity = 1;
      }, 600);
    }

    async function start() {
      const logos = await loadLogos();
      render(logos);
      setInterval(() => render(logos), INTERVAL);
    }

    start();
  </script>

</body>
</html>
