name = "shc-match-scheduler"
main = "src/worker.mjs"
compatibility_date = "2026-10-15"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "MatchScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchScheduler"]

[observability]
enabled = true
