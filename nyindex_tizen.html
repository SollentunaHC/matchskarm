
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sollentuna Hockey – Arena Style 15.1 Tizen</title>
<meta http-equiv="refresh" content="300">

<style>

/* ====== FÄRGER & GRUNDSTIL ====== */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #08132b;       /* mörkblå SHC-bakgrund */
  color: #ffffff;
  overflow: hidden;
  position: relative;
  filter: contrast(1.15) brightness(0.95); /* Tizen-kompensation */
}

/* ====== SHC-DRAKEN ====== */
body::before {
  content: "";
  position: absolute;
  top: 18%;
  left: 50%;
  width: 38vw;
  height: 38vw;
  max-width: 650px;
  max-height: 650px;
  background: url('https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/shc_draken.png') no-repeat center;
  background-size: contain;
  opacity: 0.06;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
}

/* ====== KLOCKA ====== */
#clock {
  position: fixed;
  top: 1.2vh;
  left: 1.5vw;
  font-size: 2.2vw;
  font-weight: 900;
  color: #ffffff;
  z-index: 1000;
  text-shadow: 0 0 8px rgba(0,0,0,0.7);
}

/* ====== HEADER ====== */
header {
  text-align: center;
  padding: 2.2vh 0 1.2vh;
  font-size: 4.6vw;
  font-weight: 900;
  letter-spacing: 0.35vw;
  color: #ffffff;
   /* Ändra här: från röd till mörkblå */
  background: #08132b;   /* samma som sidans bakgrund */
  z-index: 10;
  position: relative;
  text-shadow: 0 0 12px rgba(0,0,0,0.8);
  margin-bottom: 1vh; /* extra luft */
}

/* ====== SEKTIONSTITLAR ====== */
h2 {
  text-align: center;
  font-size: 2.6vw;
  font-weight: 900;
  margin: 0.5vh 0 0.3vh;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(0,0,0,0.7);
}

/* ====== TABELLER ====== */
.match-table {
  width: 96%;
  border-collapse: collapse;
  margin: 0 auto;
  table-layout: fixed;
}

.match-table th, .match-table td {
  padding: 1.15vh 0.8vw;
  font-size: 1.35vw;
  font-weight: 750;
  white-space: nowrap;
  text-align: center;
  vertical-align: middle;
}

.match-table th {
  background: #b71c1c;
  color: #ffffff;
  font-weight: 900;
  font-size: 1.15vw;
  letter-spacing: 0.08em;
}

/* Samma kolumnbredder i båda tabellerna. Resultatplatsen är tom i kommande. */
.col-date  { width: 8%; }
.col-time  { width: 10%; }
.col-series { width: 18%; }
.col-team  { width: 20%; }
.col-score { width: 10%; }
.col-arena { width: 14%; }
.match-table th + th, .match-table td + td { border-left: 1px solid rgba(255,255,255,0.08); }
.match-table td { border-bottom: 1px solid rgba(255,255,255,0.10); }
.score-spacer { color: transparent; }

/* Dagens match görs extra stor för publik som ser skärmen på långt avstånd. */
.today-table td { font-size: 1.6vw; font-weight: 800; padding-top: 1.5vh; padding-bottom: 1.5vh; }

/* Sollentuna markeras tydligt på samma sätt som i Arena Style 15.1. */
.shc-team { color: #ffff33; font-weight: 950; text-shadow: 0 0 7px rgba(255,255,51,0.35); }
.shc-team::before { content: ""; display: inline-block; width: 5px; height: 1.15em; margin-right: 0.45em; vertical-align: -0.15em; border-radius: 4px; background: #d2242b; }

.status-tag { display: inline-block; margin-left: 0.45em; padding: 0.2em 0.55em; border-radius: 999px; font-size: 0.65em; font-weight: 950; }
.status-soon { color: #241b00; background: #ffd447; }
.status-live { color: #052513; background: #46d17d; }
.score-cell { text-align: center; }
.score { display: inline-block; min-width: 4em; padding: 0.18em 0.5em; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(0,0,0,0.3); font-size: 1.15em; font-weight: 950; }
.live-score { color: #071d10; background: #46d17d; border-color: #46d17d; }
.score-detail { display: block; margin-top: 0.25em; color: #46d17d; font-size: 0.58em; font-weight: 900; }

.match-table tbody tr:nth-child(even) { background: #16284b; }
.match-table tbody tr:nth-child(odd)  { background: #0f1e3d; }

/* ====== LAYOUTFIX FÖR TIZEN ====== */
.content-area {
  position: relative;
  z-index: 10;
  height: calc(100vh - 12vh); /* lämnar plats för sponsorbandet */
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 2vh;
}

/* ====== SPONSORBANDEROLL – TIZEN-KOMPATIBEL ====== */
.ad-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 12vh;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.35);
  border-top: 3px solid rgba(255,255,255,0.65);
  display: flex;
  align-items: center;
  z-index: 20;
}

/* Flex-container för rullning */
.ad-track {
  display: flex;
  white-space: nowrap;
  animation: scrollAds 21s linear infinite;
}

/* Loggorna – avstånd via margin (Tizen saknar gap-stöd) */
.ad-track img {
  height: 10vh;
  object-fit: contain;
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
  margin-right: 8vw;
}

/* Responsiv avståndsjustering */
@media (max-width: 1800px) {
  .ad-track img { margin-right: 6vw; }
}

@media (max-width: 1200px) {
  .ad-track img { margin-right: 4vw; }
}

@media (max-width: 800px) {
  .ad-track img { margin-right: 2vw; }
}

/* Rullningsanimation */
@keyframes scrollAds {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}


.ad-track img {
  height: 10vh;
  object-fit: contain;
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
}

@keyframes scrollAds {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

  /* Gul text för "Inga matcher idag" */
.no-matches {
  color: #ffeb3b !important;  /* skarp gul */
  font-weight: 900;
  text-shadow: 0 0 6px rgba(0,0,0,0.6); /* ger lite djup mot mörkblå bakgrund */
}

/* ====== FOOTER & VERSION ====== */
footer {
  text-align: right;
  font-size: 1vw;
  opacity: 0.7;
  margin: 0.8vh 3vw 0;
  z-index: 10;
  position: relative;
}

#versionTag {
  position: fixed;
  bottom: 11vh;
  left: 1vw;
  font-size: 0.9vw;
  opacity: 0.45;
  z-index: 50;
  pointer-events: none;
}

/* ====== CYLOQ-HALLLOGGA ====== */
.hall-logo {
  display: inline-block;
  width: 60px;
  height: 60px;
  background-size: contain;
  background-repeat: no-repeat;
  vertical-align: middle;
  margin-right: 4px;
  position: relative;
  top: 4px; /* justerar loggan nedåt för perfekt centrering */
}

.hall-cyloq {
  background-image: url('sponsors/Cyloq.png'); /* lokal bild */
}  
  
</style>
</head>

<body>

<div id="clock"></div>
<header>SOLLENTUNA HOCKEY</header>

<div class="content-area">

  <h2>DAGENS MATCHER</h2>
  <div class="table-wrapper">
    <table class="match-table today-table">
      <thead>
        <tr>
          <th class="col-date">DATUM</th>
          <th class="col-time">TID</th>
          <th class="col-series">SERIE</th>
          <th class="col-team">HEMMALAG</th>
          <th class="col-team">BORTALAG</th>
          <th class="col-score">RESULTAT</th>
          <th class="col-arena">HALL</th>
        </tr>
      </thead>
      <tbody id="todayMatchBody">
        <tr><td colspan="7">Laddar...</td></tr>
      </tbody>
    </table>
  </div>

  <h2>KOMMANDE MATCHER</h2>
  <div class="table-wrapper">
    <table class="match-table">
      <thead>
        <tr>
          <th class="col-date">DATUM</th>
          <th class="col-time">TID</th>
          <th class="col-series">SERIE</th>
          <th class="col-team">HEMMALAG</th>
          <th class="col-team">BORTALAG</th>
          <th class="col-score" aria-hidden="true"></th>
          <th class="col-arena">HALL</th>
        </tr>
      </thead>
      <tbody id="upcomingBody">
        <tr><td colspan="7">Laddar...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<footer id="updatedInfo"></footer>

<div class="ad-bar">
  <div class="ad-track" id="sponsorTrack"></div>
</div>

<div id="versionTag"></div>

<script>

var ARENA_VERSION = "Arena Style 15.1 Tizen";
var CSV_URL = "Spelschema_2627.csv";
var LIVE_RESULT_PROXY = "https://sollentuna-hockey-live.gunnar-127.workers.dev/live?match=";
var activeTodayMatches = [];

/* CYLOQ-logo */
function hallWithLogo(arena) {
  if (!arena) return "";
  var lower = arena.toLowerCase();
  if (lower.indexOf("cyloq") === 0) {
    var suffix = arena.replace(/cyloq\s*/i, "");
    return "<span class='hall-logo hall-cyloq'></span>" + suffix.trim();
  }
  return arena;
}  
  
/* Klocka */
function updateClock() {
  var now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("sv-SE", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
}

/* Datumformat "14 juni" */
function formatDate(dateStr) {
  if (!dateStr) return "";
  var parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;

  var months = {
    "01": "januari", "02": "februari", "03": "mars", "04": "april",
    "05": "maj", "06": "juni", "07": "juli", "08": "augusti",
    "09": "september", "10": "oktober", "11": "november", "12": "december"
  };

  return parseInt(parts[2], 10) + " " + months[parts[1]];
}

/* Live-status */
function getStatus(dateStr, timeStr) {
  if (!dateStr || !timeStr) return "";
  var now = new Date();
  var start = new Date(dateStr + "T" + timeStr);
  var diffMinutes = (start - now) / 60000;
  var diffSinceStart = (now - start) / 60000;

  if (diffMinutes > 0 && diffMinutes <= 60)
    return "<span class='status-tag status-soon'>SNART</span>";

  if (diffSinceStart >= 0 && diffSinceStart <= 150)
    return "<span class='status-tag status-live'>LIVE</span>";

  return "";
}

/* CSV → matcher */
function parseMatchesFromCSV(text) {
  var lines = text.split(/\r?\n/);
  var filteredLines = [];
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].trim() !== "") {
      filteredLines.push(lines[i]);
    }
  }
  if (filteredLines.length < 2) return [];

  var headers = filteredLines[0].split(";");
  var idx = {
    Speldatum: headers.indexOf("Speldatum"),
    Tid: headers.indexOf("Tid"),
    Hemma: headers.indexOf("Hemma"),
    Borta: headers.indexOf("Borta"),
    Arena: headers.indexOf("Arena"),
    Serie: headers.indexOf("Serie"),
    Matchnr: headers.indexOf("Matchnr")
  };

 var matches = [];

for (var j = 1; j < filteredLines.length; j++) {
  var cols = filteredLines[j].split(";");

  var arenaRaw = cols[idx.Arena] || "";
  var arena = arenaRaw.toLowerCase().trim();

  // Ta bara med matcher där arenan börjar på "cyloq"
  if (!arena.startsWith("cyloq")) continue;

  matches.push({
    matchNumber: idx.Matchnr >= 0 ? (cols[idx.Matchnr] || "").replace(/\D/g, "") : "",
    date: cols[idx.Speldatum],
    time: cols[idx.Tid],
    home: cols[idx.Hemma],
    away: cols[idx.Borta],
    arena: cols[idx.Arena],
      series: (cols[idx.Serie] || "").replace(/\[[0-9]+\]/g, "").trim()
    });
  }

  return matches;
}

/* Markerar Sollentuna i neongult. */
function teamCell(team) {
  var value = team || "";
  var className = value.toLowerCase().indexOf("sollentuna") >= 0 ? "shc-team" : "";
  return "<td class='" + className + "'>" + value + "</td>";
}

/* Hämtar resultat från Cloudflare Workern med Tizen-kompatibel XMLHttpRequest. */
function loadLiveResult(match) {
  if (!match || !match.matchNumber) return;
  var query = LIVE_RESULT_PROXY + encodeURIComponent(match.matchNumber) +
    "&date=" + encodeURIComponent(match.date || "") +
    "&home=" + encodeURIComponent(match.home || "") +
    "&away=" + encodeURIComponent(match.away || "");
  var xhr = new XMLHttpRequest();
  xhr.open("GET", query, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || xhr.status < 200 || xhr.status >= 300) return;
    try {
      var result = JSON.parse(xhr.responseText);
      updateLiveResult(match.matchNumber, result);
    } catch (e) {
      console.log("Kunde inte tolka resultat för " + match.matchNumber);
    }
  };
  xhr.send(null);
}

/* Visar resultat och tar bort LIVE-symbolen så snart status är SLUT. */
function updateLiveResult(matchNumber, result) {
  var scoreCell = document.getElementById("score-" + matchNumber);
  if (!scoreCell || typeof result.homeScore !== "number" || typeof result.awayScore !== "number") return;
  var status = String(result.status || "RESULTAT").toUpperCase();
  var isLive = status === "LIVE";
  var statusCell = document.getElementById("status-" + matchNumber);
  if (statusCell) {
    statusCell.innerHTML = isLive ? "<span class='status-tag status-live'>LIVE</span>" : "";
  }
  var detail = status;
  if (isLive && result.period) detail += " • PERIOD " + result.period;
  if (isLive && result.gameTime) detail += " • " + result.gameTime;
  scoreCell.innerHTML = "<span class='score" + (isLive ? " live-score" : "") + "'>" +
    result.homeScore + "–" + result.awayScore + "</span>" +
    "<span class='score-detail'>" + detail + "</span>";
}

function loadAllLiveResults(matches) {
  for (var i = 0; i < matches.length; i++) loadLiveResult(matches[i]);
}

/* Dela upp i dagens + kommande */
function splitTodayAndUpcoming(matches) {
  var now = new Date();
  var todayKey = now.getFullYear() + "-" +
    ("0" + (now.getMonth() + 1)).slice(-2) + "-" +
    ("0" + now.getDate()).slice(-2);

  var today = [];
  var upcoming = [];

  for (var i = 0; i < matches.length; i++) {
    var m = matches[i];
    if (!m.date) continue;
    if (m.date === todayKey) {
      today.push(m);
      continue;
    }
    if (m.date > todayKey) upcoming.push(m);
  }

  upcoming.sort(function (a, b) {
    return (a.date + " " + a.time).localeCompare(b.date + " " + b.time);
  });
  return { today: today, upcoming: upcoming.slice(0, 6) };
}

/* Render: dagens matcher */
function renderTodayMatches(todayMatches) {
  var tbody = document.getElementById("todayMatchBody");
  var html = "";

  if (!todayMatches || todayMatches.length === 0) {
   html = "<tr><td colspan='7' class='no-matches'>Inga matcher idag</td></tr>";
  } else {
    for (var i = 0; i < todayMatches.length; i++) {
      var m = todayMatches[i];
      html += "<tr>" +
        "<td>" + formatDate(m.date) + "</td>" +
        "<td>" + m.time + " <span id='status-" + m.matchNumber + "'>" + getStatus(m.date, m.time) + "</span></td>" +
        "<td>" + m.series + "</td>" +
        teamCell(m.home) +
        teamCell(m.away) +
        "<td class='score-cell' id='score-" + m.matchNumber + "'><span class='score'>–</span></td>" +
        "<td>" + hallWithLogo(m.arena) + "</td>" +
      "</tr>";
    }
  }

  tbody.innerHTML = html;
  activeTodayMatches = todayMatches || [];
  loadAllLiveResults(activeTodayMatches);
}

/* Render: kommande matcher */
function renderUpcomingMatches(upcomingMatches) {
  var tbody = document.getElementById("upcomingBody");
  var html = "";

  if (!upcomingMatches || upcomingMatches.length === 0) {
    html = "<tr><td colspan='7'>Inga kommande hemmamatcher.</td></tr>";
  } else {
    for (var i = 0; i < upcomingMatches.length; i++) {
        var m = upcomingMatches[i];
        html += "<tr>" +
          "<td>" + formatDate(m.date) + "</td>" +
          "<td>" + m.time + " " + getStatus(m.date, m.time) + "</td>" +
          "<td>" + m.series + "</td>" +
          teamCell(m.home) +
          teamCell(m.away) +
          "<td class='score-spacer' aria-hidden='true'></td>" +
          "<td>" + hallWithLogo(m.arena) + "</td>" +
        "</tr>";
    }
  }

  tbody.innerHTML = html;
}

/* Ladda matcher – Tizen-kompatibel (XMLHttpRequest) */
function loadMatches() {
  try {
    var xhr = new XMLHttpRequest();
    var url = CSV_URL + "?nocache=" + new Date().getTime();
    xhr.open("GET", url, true);

    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {

          var text = xhr.responseText;
          var matches = parseMatchesFromCSV(text);
          var split = splitTodayAndUpcoming(matches);

          renderTodayMatches(split.today);
          renderUpcomingMatches(split.upcoming);

          document.getElementById("updatedInfo").textContent =
            ARENA_VERSION + " – Senast uppdaterad: " +
            new Date().toLocaleString("sv-SE");

        } else {
          document.getElementById("todayMatchBody").innerHTML =
            "<tr><td colspan='7'>Fel vid laddning av matcher.</td></tr>";
          document.getElementById("upcomingBody").innerHTML =
            "<tr><td colspan='7'>Fel vid laddning av matcher.</td></tr>";
        }
      }
    };

    xhr.send(null);

  } catch (e) {
    document.getElementById("todayMatchBody").innerHTML =
      "<tr><td colspan='7'>Fel vid laddning av matcher.</td></tr>";
    document.getElementById("upcomingBody").innerHTML =
      "<tr><td colspan='7'>Fel vid laddning av matcher.</td></tr>";
  }
}


/* Ladda sponsorer – alla PNG/JPG i /sponsors via GitHub API (XMLHttpRequest) */
function loadSponsors() {
  var track = document.getElementById("sponsorTrack");
  track.innerHTML = "";

  var sponsorImages = [
    "sponsors/Aften bil.png",
    "sponsors/CCM.png",
    "sponsors/Cyloq.png",
    "sponsors/Dammarsberg_2.png",
    "sponsors/Edsviken.png",
    "sponsors/ICA.png",
    "sponsors/Interbus-logo_218.png",
    "sponsors/MSB Center.png",
    "sponsors/Maxi_Haggvik_RGB.png",
    "sponsors/Märsta förenade.png",
    "sponsors/Nonnos.png",
    "sponsors/One_Sec.jpg",
    "sponsors/SvCater.png",
    "sponsors/Teamgear.png",
    "sponsors/max.png",
    "sponsors/trygga hiss.jpg",
    "sponsors/villarelining.png"
  ];

  // Dubbla listan för oändlig scroll
  var loopImages = sponsorImages.concat(sponsorImages);

  for (var i = 0; i < loopImages.length; i++) {
    var el = document.createElement("img");
    el.src = loopImages[i];
    track.appendChild(el);
  }
}
;

/* Init */
function initArena() {
  console.log("SOLLENTUNA HOCKEY - " + ARENA_VERSION);
  document.getElementById("versionTag").textContent = ARENA_VERSION;

  updateClock();
  setInterval(updateClock, 1000);

  loadMatches();
  loadSponsors();

  setInterval(loadMatches, 300000);
  setInterval(loadSponsors, 300000);
  setInterval(function () { loadAllLiveResults(activeTodayMatches); }, 30000);
}

document.addEventListener("DOMContentLoaded", initArena);
</script>
</body>
</html>
