<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sollentuna Hockey – Matcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background-color: #001a3d; /* mörkare arena-blå */
        color: #ffffff;
        font-family: 'Roboto Condensed', Arial, sans-serif;
        overflow: hidden;
    }

    .container {
        border: 8px solid #c8102e;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        padding-top: 20px;
    }

    /* KLOCKA */
    #clock {
        position: absolute;
        top: 20px;
        right: 40px;
        font-size: 30px;
        opacity: 0.9;
        font-weight: 300;
        text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    /* RUBRIKER */
    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 70px;
        margin: 10px 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 0 18px rgba(255,255,255,0.35);
        animation: fadeIn 1.2s ease-out;
    }

    h2 {
        font-family: 'Oswald', sans-serif;
        font-size: 42px;
        margin: 25px 0 5px 0;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 12px rgba(255,255,255,0.25);
        position: relative;
        animation: fadeIn 1.4s ease-out;
    }

    h2::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 3px;
        background: rgba(255,255,255,0.8);
        border-radius: 2px;
    }

    /* TABELLER */
    table {
        width: 90%;
        border-collapse: collapse;
        font-size: 24px;
        background: rgba(0, 47, 108, 0.85);
        margin-bottom: 25px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0,0,0,0.45);
        animation: fadeIn 1.6s ease-out;
    }

    th {
        background: linear-gradient(180deg, #e01b2f, #b50f22);
        padding: 12px;
        border-bottom: 2px solid #ffffff;
        text-transform: uppercase;
        font-size: 22px;
        letter-spacing: 1px;
    }

    td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.25);
    }

    tr:nth-child(even) {
        background-color: rgba(0, 60, 135, 0.85);
    }

    /* ANIMATIONER */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="container">

    <div id="clock">--:--</div>

    <h1>Sollentuna Hockey</h1>

    <h2>Dagens matcher</h2>
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Tid</th>
                <th>Hemmalag</th>
                <th>Bortalag</th>
                <th>Hall</th>
            </tr>
        </thead>
        <tbody id="todayTable"></tbody>
    </table>

    <h2>Kommande matcher denna vecka</h2>
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Tid</th>
                <th>Hemmalag</th>
                <th>Bortalag</th>
                <th>Hall</th>
            </tr>
        </thead>
        <tbody id="weekTable"></tbody>
    </table>

</div>

<script>
/* KLOCKA */
function updateClock() {
    const now = new Date();
    const hh = now.getHours().toString().padStart(2, "0");
    const mm = now.getMinutes().toString().padStart(2, "0");
    document.getElementById("clock").textContent = `${hh}:${mm}`;
}
setInterval(updateClock, 1000);
updateClock();

/* CSV-LOADING */
async function loadCSV() {
    const response = await fetch("Matcher.csv");
    const text = await response.text();

    const rows = text
        .replace(/\r/g, "")
        .trim()
        .split("\n")
        .slice(1)
        .map(r => r.split(";"));

    return rows.map(r => ({
        datum: r[0],
        tid: r[1],
        hemma: r[2],
        borta: r[3],
        hall: r[4]
    }));
}

/* DATUMTOLKNING */
function parseDate(d) {
    d = d.trim().replace(/"/g, "");

    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return new Date(d);

    const parts = d.split("-");
    const months = {
        "jan":0,"feb":1,"mar":2,"apr":3,"maj":4,"jun":5,
        "jul":6,"aug":7,"sep":8,"okt":9,"nov":10,"dec":11
    };
    if (parts.length === 2) {
        const day = parseInt(parts[0]);
        const mon = months[parts[1].toLowerCase()];
        const year = new Date().getFullYear();
        return new Date(year, mon, day);
    }

    const slash = d.split("/");
    if (slash.length >= 2) {
        const day = parseInt(slash[0]);
        const month = parseInt(slash[1]) - 1;
        const year = slash[2] ? parseInt(slash[2]) : new Date().getFullYear();
        return new Date(year, month, day);
    }

    return new Date();
}

function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
}

function sameWeek(date) {
    const now = new Date();
    const weekEnd = new Date();
    weekEnd.setDate(now.getDate() + (7 - now.getDay()));
    return date >= now && date <= weekEnd;
}

function addRow(table, m) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td>${m.datum}</td>
        <td>${m.tid}</td>
        <td>${m.hemma}</td>
        <td>${m.borta}</td>
        <td>${m.hall}</td>
    `;
    table.appendChild(tr);
}

async function init() {
    const data = await loadCSV();
    const today = new Date();

    const todayTable = document.getElementById("todayTable");
    const weekTable = document.getElementById("weekTable");

    data.forEach(m => {
        const d = parseDate(m.datum);
        if (sameDay(d, today)) addRow(todayTable, m);
        else if (sameWeek(d)) addRow(weekTable, m);
    });
}

init();
</script>

</body>
</html>
