<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Dagens matcher – Sollentuna Hockey</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background-color: #002f6c; /* SHC blå */
        color: #ffffff;
        font-family: 'Oswald', Arial, sans-serif;
        overflow: hidden;

        /* SHC-draken som watermark */
        background-image: url('drake.png'); /* lägg drake.png i samma mapp */
        background-repeat: no-repeat;
        background-position: center;
        background-size: 85%;
    }

    /* Pulsande drake */
    @keyframes pulseDragon {
        0%   { opacity: 0.10; }
        50%  { opacity: 0.22; }
        100% { opacity: 0.10; }
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        background-image: inherit;
        background-repeat: inherit;
        background-position: inherit;
        background-size: inherit;
        animation: pulseDragon 12s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
    }

    .container {
        border: 8px solid #c8102e; /* SHC röd */
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        position: relative;
        z-index: 2; /* ovanpå draken */
    }

    #clock {
        position: absolute;
        top: 20px;
        right: 40px;
        font-size: 28px;
        opacity: 0.85;
        font-weight: 300;
    }

    h1 {
        font-size: 72px;
        font-weight: 700;
        margin: 40px 0 20px 0;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    table {
        width: 90%;
        border-collapse: collapse;
        font-size: 26px;
        background-color: rgba(0, 47, 108, 0.9);
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    th {
        background-color: #c8102e;
        color: #ffffff;
        padding: 12px;
        text-align: center;
        font-weight: 700;
        border: 1px solid #ffffff;
        text-transform: uppercase;
    }

    td {
        padding: 10px;
        text-align: center;
        border: 1px solid #ffffff;
    }

    tr:nth-child(even) {
        background-color: #003b8e;
    }

    tr:hover {
        background-color: #0048a8;
        transition: background-color 0.3s ease;
    }
</style>
</head>

<body>

<div class="container">

    <div id="clock">--:--</div>

    <h1>Dagens matcher</h1>

    <table>
        <thead>
            <tr>
                <th>Tid</th>
                <th>Hemmalag</th>
                <th>Bortalag</th>
                <th>Hall</th>
            </tr>
        </thead>
        <tbody id="matchTable">
            <!-- Fylls automatiskt nedan -->
        </tbody>
    </table>

</div>

<script>
/* Klocka */
function updateClock() {
    const now = new Date();
    const hh = now.getHours().toString().padStart(2, "0");
    const mm = now.getMinutes().toString().padStart(2, "0");
    document.getElementById("clock").textContent = `${hh}:${mm}`;
}
setInterval(updateClock, 1000);
updateClock();

/* Exempelmatcher – byt till fetch från CSV om du vill */
const matcher = [
    { tid: "18:00", hemma: "SHC A-lag", borta: "Vallentuna", hall: "Qyloq Arena" },
    { tid: "19:00", hemma: "U20 H", borta: "Väsby", hall: "Qyloq Arena" },
    { tid: "20:00", hemma: "U18 H", borta: "Arlanda", hall: "Qyloq Arena" },
    { tid: "21:00", hemma: "U16", borta: "Wings", hall: "Qyloq Arena" }
];

const table = document.getElementById("matchTable");

matcher.forEach(m => {
    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${m.tid}</td>
        <td>${m.hemma}</td>
        <td>${m.borta}</td>
        <td>${m.hall}</td>
    `;
    table.appendChild(row);
});
</script>

</body>
</html>
