<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sollentuna HC – Arena Style 9.1</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #001633;
      color: #fff;
    }
    h1 {
      text-align: center;
      margin: 20px 0 10px;
      font-size: 36px;
      color: #ff2a2a;
      text-shadow: 0 0 10px rgba(255,0,0,0.6);
    }
    h2 {
      margin-left: 40px;
      margin-top: 30px;
      font-size: 26px;
      color: #4cb8ff;
    }
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      font-size: 18px;
      background: rgba(255,255,255,0.05);
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      text-align: left;
    }
    th {
      background: rgba(255,255,255,0.1);
      font-weight: 600;
    }
    tr:nth-child(even) {
      background: rgba(255,255,255,0.03);
    }
    .home { color: #4cff7a; font-weight: 600; }
    .away { color: #ffb84c; font-weight: 600; }
    .arena-cyloq { color: #4cb8ff; font-weight: 600; }

    /* Scrollbox för kommande matcher */
    .scroll-box {
      max-height: 420px;
      overflow-y: auto;
      margin-bottom: 40px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    footer {
      text-align: right;
      font-size: 12px;
      opacity: 0.7;
      margin: 10px 40px 20px;
    }
  </style>
</head>
<body>

  <h1>Sollentuna HC – Arena Style 9.1</h1>

  <h2>Dagens hemmamatch</h2>
  <table>
    <thead>
      <tr>
        <th>Datum</th><th>Tid</th><th>Hemma</th><th>Borta</th><th>Arena</th><th>Serie</th>
      </tr>
    </thead>
    <tbody id="todayMatchBody">
      <tr><td colspan="6">Laddar…</td></tr>
    </tbody>
  </table>

  <h2>Kommande hemmamatcher</h2>
  <div class="scroll-box">
    <table>
      <thead>
        <tr>
          <th>Datum</th><th>Tid</th><th>Hemma</th><th>Borta</th><th>Arena</th><th>Serie</th>
        </tr>
      </thead>
      <tbody id="upcomingBody">
        <tr><td colspan="6">Laddar…</td></tr>
      </tbody>
    </table>
  </div>

  <footer id="updatedInfo"></footer>

  <script>
    async function loadMatches() {
      const url = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";

      const resp = await fetch(url);
      const text = await resp.text();

      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      const headers = lines[0].split(";");

      const idx = {
        Speldatum: headers.indexOf("Speldatum"),
        Tid: headers.indexOf("Tid"),
        Hemma: headers.indexOf("Hemma"),
        Borta: headers.indexOf("Borta"),
        Arena: headers.indexOf("Arena"),
        Serie: headers.indexOf("Serie")
      };

      let matches = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(";");

        // Endast Sollentunas hemmamatcher
        if (!cols[idx.Hemma] || !cols[idx.Hemma].includes("Sollentuna HC")) continue;

        matches.push({
          date: cols[idx.Speldatum],
          time: cols[idx.Tid],
          home: cols[idx.Hemma],
          away: cols[idx.Borta],
          arena: cols[idx.Arena],
          series: cols[idx.Serie]
        });
      }

      matches.sort((a, b) => new Date(a.date) - new Date(b.date));

      const today = new Date().toISOString().split("T")[0];

      const todayMatch = matches.filter(m => m.date === today);
      const upcoming = matches.filter(m => m.date > today);

      // Begränsa kommande matcher till 10
      const upcomingLimited = upcoming.slice(0, 10);

      const todayBody = document.getElementById("todayMatchBody");
      const upcomingBody = document.getElementById("upcomingBody");

      todayBody.innerHTML = todayMatch.length === 0
        ? "<tr><td colspan='6'>Ingen hemmamatch idag.</td></tr>"
        : todayMatch.map(m => row(m)).join("");

      upcomingBody.innerHTML = upcomingLimited.length === 0
        ? "<tr><td colspan='6'>Inga kommande hemmamatcher.</td></tr>"
        : upcomingLimited.map(m => row(m)).join("");

      document.getElementById("updatedInfo").textContent =
        "Senast uppdaterad: " + new Date().toLocaleString("sv-SE");
    }

    function row(m) {
      const arenaClass = m.arena.toLowerCase().includes("cyloq") ? "arena-cyloq" : "";

      return `
        <tr>
          <td>${m.date}</td>
          <td>${m.time}</td>
          <td class="home">${m.home}</td>
          <td class="away">${m.away}</td>
          <td class="${arenaClass}">${m.arena}</td>
          <td>${m.series}</td>
        </tr>`;
    }

    loadMatches();
  </script>

</body>
</html>
