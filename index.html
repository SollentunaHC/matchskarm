<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sollentuna HC – Arena Style 9.0</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #001633;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 20px 0 10px;
      font-size: 36px;
      font-weight: 700;
      color: #ff2a2a;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
    }
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.05);
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      text-align: left;
    }
    th {
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }
    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.03);
    }
    .home {
      color: #4cff7a;
      font-weight: 600;
    }
    .away {
      color: #ffb84c;
      font-weight: 600;
    }
    .arena-cyloq {
      color: #4cb8ff;
      font-weight: 600;
    }
    footer {
      text-align: right;
      font-size: 12px;
      opacity: 0.7;
      margin: 10px 40px 20px;
    }
  </style>
</head>
<body>
  <header>Sollentuna HC – Spelschema 26/27</header>

  <table>
    <thead>
      <tr>
        <th>Datum</th>
        <th>Tid</th>
        <th>Hemma</th>
        <th>Borta</th>
        <th>Arena</th>
        <th>Serie</th>
      </tr>
    </thead>
    <tbody id="matchTableBody">
      <tr><td colspan="6">Laddar matcher…</td></tr>
    </tbody>
  </table>

  <footer id="updatedInfo"></footer>

  <script>
    async function loadMatches() {
      const url = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";

      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Kunde inte hämta CSV");
        const text = await resp.text();

        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        if (lines.length < 2) {
          document.getElementById("matchTableBody").innerHTML =
            "<tr><td colspan='6'>Inga matcher hittades.</td></tr>";
          return;
        }

        const headers = lines[0].split(";");
        const idx = {
          Speldatum: headers.indexOf("Speldatum"),
          Tid: headers.indexOf("Tid"),
          Hemma: headers.indexOf("Hemma"),
          Borta: headers.indexOf("Borta"),
          Arena: headers.indexOf("Arena"),
          Serie: headers.indexOf("Serie")
        };

        let matches = [];

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(";");
          if (!cols[idx.Speldatum] || !cols[idx.Hemma]) continue;

          const home = cols[idx.Hemma] || "";
          const away = cols[idx.Borta] || "";

          if (!home.includes("Sollentuna HC") && !away.includes("Sollentuna HC")) continue;

          matches.push({
            date: cols[idx.Speldatum],
            time: cols[idx.Tid] || "",
            home,
            away,
            arena: cols[idx.Arena] || "",
            series: cols[idx.Serie] || ""
          });
        }

        matches.sort((a, b) => new Date(a.date) - new Date(b.date));

        const tbody = document.getElementById("matchTableBody");
        tbody.innerHTML = "";

        if (matches.length === 0) {
          tbody.innerHTML = "<tr><td colspan='6'>Inga Sollentuna‑matcher hittades.</td></tr>";
        } else {
          for (const m of matches) {
            const homeClass = m.home.includes("Sollentuna HC") ? "home" : "away";
            const awayClass = m.away.includes("Sollentuna HC") ? "home" : "away";
            const arenaClass = m.arena.toLowerCase().includes("cyloq") ? "arena-cyloq" : "";

            tbody.innerHTML += `
              <tr>
                <td>${m.date}</td>
                <td>${m.time}</td>
                <td class="${homeClass}">${m.home}</td>
                <td class="${awayClass}">${m.away}</td>
                <td class="${arenaClass}">${m.arena}</td>
                <td>${m.series}</td>
              </tr>`;
          }
        }

        const now = new Date();
        document.getElementById("updatedInfo").textContent =
          "Senast uppdaterad: " +
          now.toLocaleDateString("sv-SE") + " " +
          now.toLocaleTimeString("sv-SE");

      } catch (err) {
        console.error(err);
        document.getElementById("matchTableBody").innerHTML =
          "<tr><td colspan='6'>Fel vid hämtning av spelschema.</td></tr>";
      }
    }

    loadMatches();
  </script>
</body>
</html>
