<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sollentuna Hockey – Arena Style 12.2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #00163b;
      color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-top: 2vh;
    }

    table {
      width: 96%;
      margin: 2vh auto;
      border-collapse: collapse;
      font-size: 2.2vh;
    }

    th, td {
      padding: 0.6vh 0.8vh;
      border-bottom: 1px solid #444;
    }

    th {
      background-color: #b00000;
      text-align: left;
    }

    #statusBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      font-size: 1.6vh;
      padding: 0.5vh 1vh;
      background: #000814;
      color: #cccccc;
    }

    /* ---------------------------------------------------------
       SPONSOR-SCROLL (horisontell)
    --------------------------------------------------------- */
    #sponsorTrack {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      height: 70px;
      margin-top: 2vh;
      text-align: center;
    }

    #sponsorInner {
      display: inline-block;
      white-space: nowrap;
      animation: sponsorScroll 25s linear infinite;
    }

    #sponsorInner img {
      height: 60px;
      margin: 0 30px;
      vertical-align: middle;
    }

    @keyframes sponsorScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ---------------------------------------------------------
       KOMMANDE MATCHER-SCROLL (vertikal)
    --------------------------------------------------------- */
    #upcomingBody.scrolling {
      display: block;
      max-height: 32vh;
      overflow: hidden;
      animation: scrollUp 18s linear infinite;
    }

    @keyframes scrollUp {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
  </style>
</head>
<body>

  <h1>SOLLENTUNA HOCKEY – MATCHSKÄRM</h1>

  <!-- Sponsor-scroll -->
  <div id="sponsorTrack">
    <div id="sponsorInner">Laddar sponsorer…</div>
  </div>

  <!-- Matchtabell -->
  <table>
    <thead>
      <tr>
        <th>Datum</th>
        <th>Tid</th>
        <th>Serie</th>
        <th>Hemmalag</th>
        <th>Bortalag</th>
        <th>Arena</th>
      </tr>
    </thead>
    <tbody id="matchesBody">
      <tr><td colspan="6">Laddar matcher…</td></tr>
    </tbody>
  </table>

  <div id="statusBar">Arena Style 12.2 – Startar…</div>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";
    const SPONSOR_PATH = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/sponsors/";
    const ARENA_VERSION = "Arena Style 12.2";

    /* ---------------------------------------------------------
       1. HÄMTA MATCHER (CSV var 5:e minut)
    --------------------------------------------------------- */
    async function loadMatches() {
      const tbody = document.getElementById("matchesBody");
      const status = document.getElementById("statusBar");

      try {
        status.textContent = ARENA_VERSION + " – Hämtar matcher…";

        const resp = await fetch(CSV_URL + "?nocache=" + Date.now(), { cache: "no-store" });
        console.log("CSV status:", resp.status);

        if (!resp.ok) {
          tbody.innerHTML = "<tr><td colspan='6'>Fel vid laddning av matcher (status " + resp.status + ").</td></tr>";
          status.textContent = ARENA_VERSION + " – Fel: " + resp.status;
          return;
        }

        const text = await resp.text();
        const rows = text.trim().split("\n");
        const header = rows.shift().split(";");

        const idx = {
          Speldatum: header.indexOf("Speldatum"),
          Tid: header.indexOf("Tid"),
          Serie: header.indexOf("Serie"),
          Hemma: header.indexOf("Hemmalag"),
          Borta: header.indexOf("Bortalag"),
          Arena: header.indexOf("Spelplats")
        };

        const matches = rows.map(r => r.split(";")).map(cols => ({
          date: cols[idx.Speldatum] || "",
          time: cols[idx.Tid] || "",
          series: (cols[idx.Serie] || "").replace(/\[[^\]]+\]

/g, "").trim(),
          home: cols[idx.Hemma] || "",
          away: cols[idx.Borta] || "",
          arena: cols[idx.Arena] || ""
        }));

        let html = "";
        for (const m of matches) {
          html += `
            <tr>
              <td>${m.date}</td>
              <td>${m.time}</td>
              <td>${m.series}</td>
              <td>${m.home}</td>
              <td>${m.away}</td>
              <td>${m.arena}</td>
            </tr>`;
        }

        tbody.innerHTML = html;
        status.textContent = ARENA_VERSION + " – Matcher uppdaterade: " +
          new Date().toLocaleString("sv-SE");

      } catch (err) {
        console.error("Fel vid laddning av matcher:", err);
        tbody.innerHTML = "<tr><td colspan='6'>Tekniskt fel vid laddning av matcher.</td></tr>";
        status.textContent = ARENA_VERSION + " – Tekniskt fel";
      }
    }

    /* ---------------------------------------------------------
       2. HÄMTA SPONSORER (RAW-länkar var 5:e minut)
    --------------------------------------------------------- */
    async function loadSponsors() {
      const track = document.getElementById("sponsorInner");
      track.textContent = "Laddar sponsorer…";

      try {
        const resp = await fetch("https://api.github.com/repos/SollentunaHC/matchskarm/contents/sponsors");
        console.log("Sponsor API status:", resp.status);

        if (!resp.ok) {
          track.textContent = "Kunde inte ladda sponsorer.";
          return;
        }

        const files = await resp.json();
        let logos = [];

        for (const f of files) {
          if (f.name.endsWith(".png") || f.name.endsWith(".jpg")) {
            logos.push(`<img src="${SPONSOR_PATH}${f.name}?v=${Date.now()}">`);
          }
        }

        // Dubblera listan för sömlös scroll
        const doubled = logos.concat(logos).join("");
        track.innerHTML = doubled;

      } catch (err) {
        console.error("Sponsor-fel:", err);
        track.textContent = "Tekniskt fel vid sponsorhämtning.";
      }
    }

    /* ---------------------------------------------------------
       3. INITIERA ARENAN
    --------------------------------------------------------- */
    function initArena() {
      document.getElementById("statusBar").textContent = ARENA_VERSION + " – Startar…";

      // Första laddningen direkt
      loadMatches();
      loadSponsors();

      // CSV var 5:e minut
      setInterval(loadMatches, 300000);

      // Sponsorer var 5:e minut
      setInterval(loadSponsors, 300000);
    }

    window.addEventListener("load", initArena);
  </script>

</body>
</html>
