<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sollentuna Hockey – Matcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* GLOBALT + INTRO */
body {
    margin: 0;
    background-color: #081a3a;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    overflow: hidden;
    animation: introFade 1.8s ease-out;
}
@keyframes introFade {
    from { opacity: 0; transform: scale(1.03); }
    to   { opacity: 1; transform: scale(1); }
}
.container {
    border: 8px solid #c8102e;
    height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding-top: 20px;
    padding-bottom: 140px;
}

/* SHC-DRAKE WATERMARK */
#watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 75%;
    opacity: 0.015;
    filter: brightness(0.6);
    transform: translate(-50%, -50%);
    animation: pulse 12s ease-in-out infinite;
    pointer-events: none;
}
@keyframes pulse {
    0%   { opacity: 0.01; }
    50%  { opacity: 0.02; }
    100% { opacity: 0.01; }
}

/* KLOCKA */
#clock {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 32px;
    opacity: 0.9;
    font-weight: 300;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
}

/* RUBRIKER */
h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 100px;
    margin: 10px 0 10px 0;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 0 25px rgba(255,255,255,0.45);
    animation: fadeIn 1.2s ease-out;
}
h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 58px;
    margin: 25px 0 5px 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255,255,255,0.25);
    animation: fadeIn 1.4s ease-out;
}

/* TABELLER */
table {
    width: 90%;
    border-collapse: collapse;
    font-size: 26px;
    background: rgba(0, 47, 108, 0.85);
    margin-bottom: 25px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0,0,0,0.45);
    animation: fadeIn 1.6s ease-out;
}
th {
    background: linear-gradient(180deg, #e01b2f, #b50f22);
    padding: 14px;
    border-bottom: 2px solid #ffffff;
    text-transform: uppercase;
    font-size: 24px;
    letter-spacing: 1px;
}
td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.25);
}
tr:nth-child(even) {
    background-color: rgba(0, 60, 135, 0.85);
}

/* LED-LISTA – SÖMLÖS SCROLL */
#sponsorBar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: rgba(255,255,255,0.25);
    overflow: hidden;
    border-top: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
}
#sponsorTrack {
    display: flex;
    gap: 80px;
    animation: scrollSponsors 25s linear infinite;
}
#sponsorTrack img {
    height: 80px;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
}
@keyframes scrollSponsors {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
</style>
</head>

<body>

<div class="container">

    <img id="watermark" src="drake.png" alt="SHC-drake">

    <div id="clock">--:--</div>

    <h1>Sollentuna Hockey</h1>

    <h2>Dagens matcher</h2>
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Tid</th>
                <th>Hemmalag</th>
                <th>Bortalag</th>
                <th>Hall</th>
            </tr>
        </thead>
        <tbody id="todayTable"></tbody>
    </table>

    <h2>Kommande matcher</h2>
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Tid</th>
                <th>Hemmalag</th>
                <th>Bortalag</th>
                <th>Hall</th>
            </tr>
        </thead>
        <tbody id="weekTable"></tbody>
    </table>

    <div id="sponsorBar">
        <div id="sponsorTrack"></div>
    </div>

</div>

<script>
/* KLOCKA */
function updateClock() {
    const now = new Date();
    const hh = now.getHours().toString().padStart(2, "0");
    const mm = now.getMinutes().toString().padStart(2, "0");
    document.getElementById("clock").textContent = `${hh}:${mm}`;
}
setInterval(updateClock, 1000);
updateClock();

/* CSV-LOADING */
async function loadCSV() {
    const response = await fetch("Matcher.csv");
    const text = await response.text();

    const rows = text
        .replace(/\r/g, "")
        .trim()
        .split("\n")
        .slice(1)
        .map(r => r.split(";"));

    return rows.map(r => ({
        datum: r[0],
        tid: r[1],
        hemma: r[2],
        borta: r[3],
        hall: r[4]
    }));
}

/* DATUMFORMAT + VECKODAG */
const months = {
    "jan":"januari","feb":"februari","mar":"mars","apr":"april","maj":"maj","jun":"juni",
    "jul":"juli","aug":"augusti","sep":"september","okt":"oktober","nov":"november","dec":"december"
};
const weekdays = ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];

function formatDate(d) {
    const day = d.getDate();
    const weekday = weekdays[d.getDay()];
    const monthKey = d.toLocaleString("sv-SE", { month: "short" })
        .replace(".", "")
        .substring(0,3)
        .toLowerCase();
    const month = months[monthKey] || "";
    return `${weekday} ${day} ${month}`;
}

function parseDate(d) {
    d = d.trim().replace(/"/g, "");

    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return new Date(d);

    const parts = d.split("-");
    if (parts.length === 2) {
        const day = parseInt(parts[0]);
        const monKey = parts[1].toLowerCase();
        const monName = months[monKey];
        const monthIndex = Object.values(months).indexOf(monName);
        const year = new Date().getFullYear();
        return new Date(year, monthIndex, day);
    }

    const slash = d.split("/");
    if (slash.length >= 2) {
        const day = parseInt(slash[0]);
        const month = parseInt(slash[1]) - 1;
        const year = slash[2] ? parseInt(slash[2]) : new Date().getFullYear();
        return new Date(year, month, day);
    }

    return new Date();
}

function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
}
function sameWeek(date) {
    const now = new Date();
    const weekEnd = new Date();
    weekEnd.setDate(now.getDate() + (7 - now.getDay()));
    return date >= now && date <= weekEnd;
}

/* TABELLER */
function addRow(table, m, d) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td>${formatDate(d)}</td>
        <td>${m.tid}</td>
        <td>${m.hemma}</td>
        <td>${m.borta}</td>
        <td>${m.hall}</td>
    `;
    table.appendChild(tr);
}

async function init() {
    const data = await loadCSV();
    const today = new Date();

    const todayTable = document.getElementById("todayTable");
    const weekTable = document.getElementById("weekTable");

    data.forEach(m => {
        const d = parseDate(m.datum);
        if (sameDay(d, today)) addRow(todayTable, m, d);
        else if (sameWeek(d)) addRow(weekTable, m, d);
    });
}
init();

/* VÄDERIKONER */
function getWeatherIcon(code) {
    if (code === 0) return "☀️";
    if ([1,2].includes(code)) return "🌤";
    if (code === 3) return "☁️";
    if ([45,48].includes(code)) return "🌫";
    if ([51,53,55].includes(code)) return "🌦";
    if ([61,63,65].includes(code)) return "🌧";
    if ([71,73,75].includes(code)) return "❄️";
    if ([95,96,99].includes(code)) return "⛈";
    return "🌡";
}

/* VÄDER + 3-TIMMARS PROGNOS */
async function getWeather() {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=59.428&longitude=17.950&current_weather=true&hourly=temperature_2m,weathercode,windspeed_10m";
    const response = await fetch(url);
    const data = await response.json();

    const now = data.current_weather;
    const hourly = data.hourly;

    const tempNow = Math.round(now.temperature);
    const windNow = Math.round(now.windspeed);
    const iconNow = getWeatherIcon(now.weathercode);

    const nextHours = [];
    const currentIndex = hourly.time.indexOf(now.time);

    for (let i = 1; i <= 3; i++) {
        const t = Math.round(hourly.temperature_2m[currentIndex + i]);
        const w = Math.round(hourly.windspeed_10m[currentIndex + i]);
        const ic = getWeatherIcon(hourly.weathercode[currentIndex + i]);
        nextHours.push(`${ic} +${i}h ${t}°C`);
    }

    return `${iconNow} Sollentuna ${tempNow}°C • Vind ${windNow} m/s • ${nextHours.join(" • ")}`;
}

/* SÖMLÖS SPONSOR-SCROLL + VÄDER */
async function initSponsors() {
    const repoOwner = "SollentunaHC";
    const repoName = "matchskarm";
    const folderPath = "sponsors";

    const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;
    const response = await fetch(apiUrl);
    const data = await response.json();

    let items = data
        .filter(item => item.type === "file" && /\.(png|jpg|jpeg|gif)$/i.test(item.name))
        .map(item => ({
            type: "image",
            value: `https://sollentunahc.github.io/${repoName}/${folderPath}/${item.name}`
        }));

    const weatherText = await getWeather();
    items.push({ type: "text", value: weatherText });

    items = [...items, ...items];

    const track = document.getElementById("sponsorTrack");
    track.innerHTML = "";

    items.forEach(item => {
        if (item.type === "image") {
            const img = document.createElement("img");
            img.src = item.value;
            track.appendChild(img);
        } else {
            const div = document.createElement("div");
            div.textContent = item.value;
            div.style.fontSize = "40px";
            div.style.fontWeight = "600";
            div.style.color = "#fff";
            div.style.textShadow = "0 0 10px rgba(0,0,0,0.6)";
            div.style.whiteSpace = "nowrap";
            track.appendChild(div);
        }
    });
}

initSponsors();
setInterval(initSponsors, 10 * 60 * 1000);
</script>

</body>
</html>
