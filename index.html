<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="300">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sollentuna Hockey – Matchskärm ver 0.2</title>

<style>
    body {
        margin: 0;
        background: #ffffff;
        font-family: Arial, sans-serif;
        color: #000;
        overflow: hidden;
    }

    header {
        background: #002f6c;
        color: white;
        padding: 10px 20px;
        text-align: left;
        font-size: 32px;
        font-weight: bold;
    }

    .layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 60px);
    }

    .next-match-container {
        flex: 0 0 40vh;
        width: 100%;
        background: #002f6c;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .nm-title {
        font-size: 56px;
        font-weight: bold;
        margin-bottom: 10px;
        letter-spacing: 4px;
    }

    .nm-teams {
        font-size: 72px;
        font-weight: bold;
        color: #c8102e;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
    }

    .nm-vs {
        margin: 0 30px;
        color: white;
    }

    .nm-info {
        font-size: 40px;
        margin-top: 10px;
    }

    .nm-arena {
        font-size: 32px;
        margin-top: 5px;
        opacity: 0.9;
    }

    .content-row {
        flex: 1 1 auto;
        display: flex;
        flex-direction: row;
        overflow: hidden;
    }

    .column {
        flex: 1;
        padding: 10px 20px;
        box-sizing: border-box;
        overflow: hidden;
    }

    .section-title {
        font-size: 32px;
        margin: 0 0 10px 0;
        font-weight: bold;
        color: #002f6c;
    }

    .match-list {
        font-size: 24px;
        max-height: calc(100% - 40px);
        overflow: hidden;
    }

    .match {
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
    }

    .match strong {
        color: #c8102e;
    }

    .sponsor-slider {
        flex: 0 0 15vh;
        width: 100%;
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        border-top: 2px solid #ddd;
    }

    .sponsor-slider img {
        max-height: 12vh;
        max-width: 90%;
        object-fit: contain;
    }
</style>
</head>

<body>

<header>SOLLENTUNA HOCKEY – MATCHSKÄRM ver 0.2</header>

<div class="layout">

    <div id="next-match" class="next-match-container">
        <div class="nm-title">NÄSTA MATCH</div>
        <div class="nm-teams">
            <span id="nm-home">–</span>
            <span class="nm-vs">VS</span>
            <span id="nm-away">–</span>
        </div>
        <div class="nm-info">
            <span id="nm-date">–</span> – <span id="nm-time">–</span>
        </div>
        <div class="nm-arena" id="nm-arena">–</div>
    </div>

    <div class="content-row">
        <div class="column">
            <div class="section-title">DAGENS MATCHER</div>
            <div id="today" class="match-list">Laddar...</div>
        </div>
        <div class="column">
            <div class="section-title">KOMMANDE MATCHER</div>
            <div id="upcoming" class="match-list">Laddar...</div>
        </div>
    </div>

    <div class="sponsor-slider">
        <img id="sponsor-img" src="sponsor1.png" alt="Sponsor" />
    </div>

</div>

<script>
const excelUrl = "https://sollentunahc-my.sharepoint.com/:x:/g/personal/gunnar_sollentunahockey_com/IQA6KPTEYK18S6O_-x8bORm9ARTU-4PV65G8FYDlyK9WKis?download=1";


async function fetchExcelData() {
    try {
        const response = await fetch(excelUrl);
        const text = await response.text();
        const rows = text.trim().split("\n").map(r => r.split(";"));
        return rows.slice(1);
    } catch (e) {
        console.error("Fel vid hämtning:", e);
        return [];
    }
}

function parseDate(dateStr) {
    const months = {
        "jan": 0, "feb": 1, "mar": 2, "apr": 3, "maj": 4, "jun": 5,
        "jul": 6, "aug": 7, "sep": 8, "okt": 9, "nov": 10, "dec": 11
    };
    const [day, mon] = dateStr.split("-");
    const monthIndex = months[mon.toLowerCase()];
    const year = new Date().getFullYear();
    return new Date(year, monthIndex, parseInt(day));
}

function isToday(dateStr) {
    const d = parseDate(dateStr);
    const today = new Date();
    return d.toDateString() === today.toDateString();
}

function isUpcoming(dateStr) {
    return parseDate(dateStr) > new Date();
}

function renderMatches(matches, containerId) {
    const container = document.getElementById(containerId);
    if (!matches || matches.length === 0) {
        container.innerHTML = "<div class='match'>Inga matcher</div>";
        return;
    }
    container.innerHTML = matches.map(m => `
        <div class="match">
            <strong>${m[2]}</strong> vs <strong>${m[3]}</strong><br>
            ${m[0]} – ${m[1]}<br>
            Hall: ${m[4]}
        </div>
    `).join("");
}

async function loadMatches() {
    const data = await fetchExcelData();

    const todayMatches = data.filter(m => isToday(m[0]));
    const upcomingMatches = data
        .filter(m => isUpcoming(m[0]))
        .sort((a, b) => parseDate(a[0]) - parseDate(b[0]));

    let next = upcomingMatches[0] || todayMatches[0] || null;

    if (next) {
        document.getElementById("nm-home").textContent = next[2];
        document.getElementById("nm-away").textContent = next[3];
        document.getElementById("nm-date").textContent = next[0];
        document.getElementById("nm-time").textContent = next[1];
        document.getElementById("nm-arena").textContent = next[4];
    }

    renderMatches(todayMatches, "today");
    renderMatches(upcomingMatches.slice(0, 10), "upcoming");
}

loadMatches();

const sponsorImages = ["sponsor1.png", "sponsor2.png", "sponsor3.png"];
let sponsorIndex = 0;

setInterval(() => {
    sponsorIndex = (sponsorIndex + 1) % sponsorImages.length;
    document.getElementById("sponsor-img").src = sponsorImages[sponsorIndex];
}, 6000);
</script>

</body>
</html>
