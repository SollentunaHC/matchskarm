<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sollentuna Hockey – Matcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background-color:#081a3a;color:#fff;font-family:'Roboto Condensed',Arial,sans-serif;overflow:hidden}
.container{border:8px solid #c8102e;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;position:relative;padding-top:20px;padding-bottom:140px}
#watermark{position:absolute;top:50%;left:50%;width:75%;opacity:0.015;filter:brightness(0.6);transform:translate(-50%,-50%);pointer-events:none}
#clock{position:absolute;top:20px;right:40px;font-size:32px;opacity:0.9;font-weight:300;text-shadow:0 0 8px rgba(255,255,255,0.4)}
h1{font-family:'Oswald',sans-serif;font-size:100px;margin:10px 0;text-transform:uppercase;letter-spacing:4px}
h2{font-family:'Oswald',sans-serif;font-size:58px;margin:25px 0 5px 0;text-transform:uppercase;letter-spacing:2px}

/* TABELLER */
table{width:90%;border-collapse:collapse;font-size:26px;background:rgba(0,47,108,0.85);margin-bottom:25px;border-radius:8px;overflow:hidden}
th{padding:14px;border-bottom:2px solid #fff;text-transform:uppercase;font-size:22px}
td{padding:12px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.25)}
tr:nth-child(even){background-color:rgba(0,60,135,0.85)}

/* FAST RUBRIK + RULLGARDIN */
#weekTable{
    width:90%;
    border-collapse:collapse;
    font-size:26px;
    background:rgba(0,47,108,0.85);
    border-radius:8px;
    overflow:hidden;
    position:relative;
}

#weekTable thead{
    display:table;
    width:100%;
    table-layout:fixed;
    background:linear-gradient(180deg,#e01b2f,#b50f22);
    position:sticky;
    top:0;
    z-index:2;
}

#weekTable tbody{
    display:block;
    height:350px;
    overflow:hidden;
    animation:scrollUp 22s linear infinite;
}

#weekTable tr{
    display:table;
    width:100%;
    table-layout:fixed;
}

#weekTable td, #weekTable th{
    text-align:center;
    padding:10px 0;
}

@keyframes scrollUp{
    0%{transform:translateY(0)}
    100%{transform:translateY(-100%)}
}

/* SPONSORREMSA */
#sponsorBar{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:120px;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(4px);
    overflow:hidden;
    border-top:3px solid rgba(255,255,255,0.65);
    display:flex;
    align-items:center;
}
#sponsorTrack{display:flex;gap:80px;animation:scrollSponsors 25s linear infinite}
#sponsorTrack img{height:80px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(0,0,0,0.4))}
@keyframes scrollSponsors{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
</style>
</head>

<body>
<div class="container">

<img id="watermark" src="drake.png" alt="SHC-drake">
<div id="clock">--:--</div>

<h1>Sollentuna Hockey</h1>

<h2>Dagens matcher</h2>
<table>
<thead>
<tr>
<th>Datum</th>
<th>Tid</th>
<th>Hemmalag</th>
<th>Bortalag</th>
<th>Hall</th>
<th>Status</th>
<th>Group</th>
</tr>
</thead>
<tbody id="todayTable"></tbody>
</table>

<h2>Kommande matcher</h2>
<table id="weekTable">
<thead>
<tr>
<th>Datum</th>
<th>Tid</th>
<th>Hemmalag</th>
<th>Bortalag</th>
<th>Hall</th>
<th>Status</th>
<th>Group</th>
</tr>
</thead>
<tbody id="weekTableBody"></tbody>
</table>

<div id="sponsorBar"><div id="sponsorTrack"></div></div>

</div>

<script>
/* KLOCKA */
function updateClock(){
    const now=new Date();
    const hh=now.getHours().toString().padStart(2,"0");
    const mm=now.getMinutes().toString().padStart(2,"0");
    document.getElementById("clock").textContent=`${hh}:${mm}`;
}
setInterval(updateClock,1000);updateClock();

/* SWEHOCKEY VIA PROXY */
async function loadMatches(){
    const url="https://sollentunahc.github.io/matchskarm/proxy/swehockey.js";
    const xmlText=await fetch(url).then(r=>r.text());
    const xml=new DOMParser().parseFromString(xmlText,"text/xml");

    return [...xml.querySelectorAll("Match")].map(m=>({
        date:m.querySelector("Date").textContent,
        time:m.querySelector("Time").textContent,
        home:m.querySelector("HomeTeam").textContent,
        away:m.querySelector("AwayTeam").textContent,
        arena:m.querySelector("Arena").textContent,
        status:m.querySelector("Status").textContent,
        group:m.querySelector("Group").textContent
    }));
}

/* DATUMFORMAT */
const weekdays=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];
const months=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];

function formatDate(d){
    return `${weekdays[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

/* INIT */
async function init(){
    const data=await loadMatches();
    const today=new Date();
    const todayTable=document.getElementById("todayTable");
    const weekTableBody=document.getElementById("weekTableBody");

    let upcoming=[];

    data.forEach(m=>{
        const d=new Date(m.date);

        if(d.toDateString()===today.toDateString()){
            addRow(todayTable,m,d);
            return;
        }

        const diff=(d - today)/(1000*60*60*24);
        if(diff>0 && diff<=3){
            upcoming.push({m,d});
        }
    });

    upcoming.sort((a,b)=>a.d - b.d);

    const limited=upcoming.slice(0,10);

    limited.forEach(item=>addRow(weekTableBody,item.m,item.d));
}

function addRow(table,m,d){
    const tr=document.createElement("tr");
    tr.innerHTML=
        `<td>${formatDate(d)}</td>
         <td>${m.time}</td>
         <td>${m.home}</td>
         <td>${m.away}</td>
         <td>${m.arena}</td>
         <td>${m.status}</td>
         <td>${m.group}</td>`;
    table.appendChild(tr);
}

init();

/* SPONSOR-SCROLL */
async function initSponsors(){
    const repoOwner="SollentunaHC";
    const repoName="matchskarm";
    const folderPath="sponsors";
    const apiUrl=`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;
    const response=await fetch(apiUrl);
    const data=await response.json();

    let items=data
        .filter(item=>item.type==="file"&&/\.(png|jpg|jpeg|gif)$/i.test(item.name))
        .map(item=>({value:`https://sollentunahc.github.io/${repoName}/${folderPath}/${item.name}`}));

    const track=document.getElementById("sponsorTrack");
    track.innerHTML="";

    items=[...items,...items];

    items.forEach(item=>{
        const img=document.createElement("img");
        img.src=item.value;
        track.appendChild(img);
    });
}

initSponsors();
setInterval(initSponsors,10*60*1000);
</script>

</body>
</html>
