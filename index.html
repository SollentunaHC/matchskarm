<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sollentuna Hockey – Arena Style 9.1</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1a3a;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 30px 0 10px;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }
    h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin: 20px 0 10px;
      color: #ffffff;
    }
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      font-size: 20px;
    }
    th {
      background: #c62828;
      color: #fff;
      padding: 10px;
      text-align: left;
      font-weight: 700;
    }
    td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    tr:nth-child(even) {
      background: #1e2f5c;
    }
    tr:nth-child(odd) {
      background: #14244a;
    }
    .scroll-box {
      max-height: 420px;
      overflow-y: auto;
      margin-bottom: 40px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    footer {
      text-align: right;
      font-size: 12px;
      opacity: 0.7;
      margin: 10px 40px 20px;
    }
  </style>
</head>
<body>

  <header>SOLLENTUNA HOCKEY</header>

  <h2>DAGENS MATCHER</h2>
  <table>
    <thead>
      <tr>
        <th>DATUM</th><th>TID</th><th>HEMMALAG</th><th>BORTALAG</th><th>HALL</th>
      </tr>
    </thead>
    <tbody id="todayMatchBody">
      <tr><td colspan="5">Laddar…</td></tr>
    </tbody>
  </table>

  <h2>KOMMANDE MATCHER</h2>
  <div class="scroll-box">
    <table>
      <thead>
        <tr>
          <th>DATUM</th><th>TID</th><th>HEMMALAG</th><th>BORTALAG</th><th>HALL</th>
        </tr>
      </thead>
      <tbody id="upcomingBody">
        <tr><td colspan="5">Laddar…</td></tr>
      </tbody>
    </table>
  </div>

  <footer id="updatedInfo"></footer>

  <script>
    async function loadMatches() {
      const url = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";

      const resp = await fetch(url);
      const text = await resp.text();

      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      const headers = lines[0].split(";");

      const idx = {
        Speldatum: headers.indexOf("Speldatum"),
        Tid: headers.indexOf("Tid"),
        Hemma: headers.indexOf("Hemma"),
        Borta: headers.indexOf("Borta"),
        Arena: headers.indexOf("Arena")
      };

      let matches = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(";");
        if (!cols[idx.Hemma] || !cols[idx.Hemma].includes("Sollentuna")) continue;

        matches.push({
          date: cols[idx.Speldatum],
          time: cols[idx.Tid],
          home: cols[idx.Hemma],
          away: cols[idx.Borta],
          arena: cols[idx.Arena]
        });
      }

      matches.sort((a, b) => new Date(a.date) - new Date(b.date));

      const today = new Date().toISOString().split("T")[0];
      const todayMatch = matches.filter(m => m.date === today);
      const upcoming = matches.filter(m => m.date > today).slice(0, 10);

      const todayBody = document.getElementById("todayMatchBody");
      const upcomingBody = document.getElementById("upcomingBody");

      todayBody.innerHTML = todayMatch.length === 0
        ? "<tr><td colspan='5'>Ingen hemmamatch idag.</td></tr>"
        : todayMatch.map(m => row(m)).join("");

      upcomingBody.innerHTML = upcoming.length === 0
        ? "<tr><td colspan='5'>Inga kommande hemmamatcher.</td></tr>"
        : upcoming.map(m => row(m)).join("");

      document.getElementById("updatedInfo").textContent =
        "Senast uppdaterad: " + new Date().toLocaleString("sv-SE");
    }

    function row(m) {
      return `
        <tr>
          <td>${m.date}</td>
          <td>${m.time}</td>
          <td>${m.home}</td>
          <td>${m.away}</td>
          <td>${m.arena}</td>
        </tr>`;
    }

    loadMatches();
  </script>

</body>
</html>
