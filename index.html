<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sollentuna Hockey – Arena Style 10.9 SHC</title>
<meta http-equiv="refresh" content="300">

<style>
:root {
  --bg-main: #0b1a3a;
  --bg-row-even: #1e2f5c;
  --bg-row-odd: #14244a;
  --bg-header: #c62828;
  --text-main: #ffffff;
  --yellow: #ffeb3b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  overflow: hidden;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  top: 18%;
  left: 50%;
  width: 38vw;
  height: 38vw;
  max-width: 650px;
  max-height: 650px;
  background: url('https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/shc_draken.png') no-repeat center;
  background-size: contain;
  opacity: 0.06;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
}

#clock {
  position: fixed;
  top: 1.2vh;
  left: 1.5vw;
  font-size: 2.2vw;
  font-weight: 900;
  color: var(--text-main);
  z-index: 1000;
  text-shadow: 0 0 8px rgba(0,0,0,0.7);
}

header {
  text-align: center;
  padding: 2.2vh 0 1.2vh;
  font-size: 4.6vw;
  font-weight: 900;
  letter-spacing: 0.35vw;
  color: var(--text-main);
  z-index: 10;
  position: relative;
  text-shadow: 0 0 12px rgba(0,0,0,0.8);
}

.content-area {
  position: relative;
  z-index: 10;
  height: 78vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 2vh;
}

h2 {
  text-align: center;
  font-size: 2.6vw;
  font-weight: 900;
  margin: 0.5vh 0 0.3vh;
  color: var(--text-main);
  text-shadow: 0 0 8px rgba(0,0,0,0.7);
}

.table-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
}

table.match-table {
  width: 92%;
  border-collapse: collapse;
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
  overflow: hidden;
  table-layout: fixed;
}

.match-table th, .match-table td {
  padding: 1.1vh 0.8vw;
  font-size: 1.5vw;
  font-weight: 600;
  white-space: nowrap;
  text-align: center;
  vertical-align: middle;
}

.match-table th {
  background: var(--bg-header);
  color: #fff;
  font-weight: 900;
  font-size: 1.8vw;
}

.match-table tbody tr:nth-child(even) { background: var(--bg-row-even); }
.match-table tbody tr:nth-child(odd)  { background: var(--bg-row-odd); }

/* Column widths */
.match-table th:nth-child(1), .match-table td:nth-child(1) { width: 12%; }
.match-table th:nth-child(2), .match-table td:nth-child(2) { width: 10%; }
.match-table th:nth-child(3), .match-table td:nth-child(3) { width: 26%; }
.match-table th:nth-child(4), .match-table td:nth-child(4) { width: 20%; }
.match-table th:nth-child(5), .match-table td:nth-child(5) { width: 20%; }
.match-table th:nth-child(6), .match-table td:nth-child(6) { width: 12%; }

/* CYLOQ logo perfectly centered */
.hall-logo {
  display: inline-block;
  width: 50px;
  height: 50px;
  background-size: contain;
  background-repeat: no-repeat;
  vertical-align: middle;
  margin-right: 6px;
  position: relative;
  top: 16px; /* lowered for perfect centering */
}

@media (min-width: 2000px) {
  .hall-logo {
    width: 64px;
    height: 64px;
    top: 7px; /* perfect centering on 4K */
  }
}

.hall-cyloq {
  background-image: url('https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/sponsors/Cyloq.png');
}

/* Live status tags */
.status-tag {
  font-weight: 900;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: 6px;
  font-size: 1.2vw;
}

.status-soon {
  background: #ffeb3b;
  color: #000000;
}

.status-live {
  background: #4caf50;
  color: #ffffff;
}

/* Reduced row height ONLY for upcoming matches */
#upcomingBody td {
  padding-top: 0.15vh;
  padding-bottom: 0.15vh;
}

  /* Reduced row height ONLY for coming matches */
#todayMatchBody td {
  padding-top: 0.15vh;
  padding-bottom: 0.15vh;
}
  
/* Scrolling upcoming matches */
#upcomingBody.scrolling {
  display: block;
  max-height: 30vh;
  overflow: hidden;
  animation: scrollUp 22s linear infinite;
}

@keyframes scrollUp {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

/* Banner fixed at bottom */
.ad-bar {
  width: 100%;
  height: 10vh;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(6px);
  border-top: 3px solid rgba(255,255,255,0.65);
  display: flex;
  align-items: center;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 20;
}

.ad-track {
  display: flex;
  gap: 4vw;
  white-space: nowrap;
  animation: scrollAds 35s linear infinite;
}

.ad-track img {
  height: 8vh;
  object-fit: contain;
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
}

@keyframes scrollAds {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

footer {
  text-align: right;
  font-size: 1vw;
  opacity: 0.7;
  margin: 0.8vh 3vw 0;
  z-index: 10;
  position: relative;
}
</style>
</head>

<body>

<div id="clock"></div>

<header>SOLLENTUNA HOCKEY</header>

<div class="content-area">

<h2>DAGENS MATCHER</h2>
<div class="table-wrapper">
<table class="match-table">
<thead>
<tr>
<th>DATUM</th>
<th>TID</th>
<th>SERIE</th>
<th>HEMMALAG</th>
<th>BORTALAG</th>
<th>HALL</th>
</tr>
</thead>
<tbody id="todayMatchBody">
<tr><td colspan="6">Laddar...</td></tr>
</tbody>
</table>
</div>

<h2>KOMMANDE MATCHER</h2>
<div class="table-wrapper">
<table class="match-table">
<thead>
<tr>
<th>DATUM</th>
<th>TID</th>
<th>SERIE</th>
<th>HEMMALAG</th>
<th>BORTALAG</th>
<th>HALL</th>
</tr>
</thead>
<tbody id="upcomingBody">
<tr><td colspan="6">Laddar...</td></tr>
</tbody>
</table>
</div>

</div>

<footer id="updatedInfo"></footer>

<div class="ad-bar">
<div class="ad-track" id="sponsorTrack"></div>
</div>
<script>
/* DIGITAL CLOCK */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("sv-SE", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
}
setInterval(updateClock, 1000);
updateClock();

/* FORMAT DATE → "14 juni" */
function formatDate(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;

  const months = {
    "01": "januari", "02": "februari", "03": "mars", "04": "april",
    "05": "maj", "06": "juni", "07": "juli", "08": "augusti",
    "09": "september", "10": "oktober", "11": "november", "12": "december"
  };

  return parseInt(parts[2], 10) + " " + months[parts[1]];
}

/* LIVE STATUS */
function getStatus(dateStr, timeStr) {
  if (!dateStr || !timeStr) return "";
  const now = new Date();
  const start = new Date(dateStr + "T" + timeStr);
  const diffMinutes = (start - now) / 60000;
  const diffSinceStart = (now - start) / 60000;

  if (diffMinutes > 0 && diffMinutes <= 60)
    return "<span class='status-tag status-soon'>SNART</span>";

  if (diffSinceStart >= 0 && diffSinceStart <= 120)
    return "<span class='status-tag status-live'>PÅGÅR</span>";

  return "";
}

/* CYLOQ LOGO ONLY */
function hallWithLogo(arena) {
  if (!arena) return "";
  const lower = arena.toLowerCase();
  if (lower.indexOf("cyloq") === 0) {
    const suffix = arena.replace(/cyloq\s*/i, "");
    return "<span class='hall-logo hall-cyloq'></span>" + suffix.trim();
  }
  return arena;
}

/* LOAD MATCHES */
async function loadMatches() {
  const url = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";
  const resp = await fetch(url + "?nocache=" + Date.now(), { cache: "no-store" });
  const text = await resp.text();

  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  const headers = lines[0].split(";");

  const idx = {
    Speldatum: headers.indexOf("Speldatum"),
    Tid: headers.indexOf("Tid"),
    Hemma: headers.indexOf("Hemma"),
    Borta: headers.indexOf("Borta"),
    Arena: headers.indexOf("Arena"),
    Serie: headers.indexOf("Serie")
  };

  const matches = [];

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(";");
    const home = (cols[idx.Hemma] || "")
      .toLowerCase()
      .replace(/\u00A0/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    if (
      home.indexOf("sollentuna") === -1 &&
      home.indexOf("sollentuna hc") === -1 &&
      home.indexOf("sollentuna hockey") === -1 &&
      home.indexOf("shc") === -1
    ) continue;

    matches.push({
      date: cols[idx.Speldatum],
      time: cols[idx.Tid],
      home: cols[idx.Hemma],
      away: cols[idx.Borta],
      arena: cols[idx.Arena],
      series: (cols[idx.Serie] || "").replace(/\[[0-9]+\]/g, "").trim()
    });
  }

  const now = new Date();
  const todayMonth = now.getMonth() + 1;
  const todayDay = now.getDate();

  /* TODAY MATCHES */
  const todayMatches = matches.filter(m => {
    const p = m.date.split("-");
    return parseInt(p[1], 10) === todayMonth && parseInt(p[2], 10) === todayDay;
  });

  let todayHTML = "";
  if (todayMatches.length === 0) {
    todayHTML = "<tr><td colspan='6'>Inga matcher idag.</td></tr>";
  } else {
    todayMatches.forEach(m => {
      todayHTML += "<tr>" +
        "<td>" + formatDate(m.date) + "</td>" +
        "<td>" + m.time + " " + getStatus(m.date, m.time) + "</td>" +
        "<td>" + m.series + "</td>" +
        "<td>" + m.home + "</td>" +
        "<td>" + m.away + "</td>" +
        "<td>" + hallWithLogo(m.arena) + "</td>" +
      "</tr>";
    });
  }
  document.getElementById("todayMatchBody").innerHTML = todayHTML;

  /* UPCOMING MATCHES */
  const upcomingGrouped = {};
  matches.forEach(m => {
    const p = m.date.split("-");
    const mMonth = parseInt(p[1], 10);
    const mDay = parseInt(p[2], 10);
    if (mMonth === todayMonth && mDay === todayDay) return;
    if (mMonth > todayMonth || (mMonth === todayMonth && mDay > todayDay)) {
      const key = mMonth + "-" + mDay;
      if (!upcomingGrouped[key]) upcomingGrouped[key] = [];
      upcomingGrouped[key].push(m);
    }
  });

  const upcomingKeys = Object.keys(upcomingGrouped).slice(0, 5);
  let upcomingHTML = "";
  if (upcomingKeys.length === 0) {
    upcomingHTML = "<tr><td colspan='6'>Inga kommande hemmamatcher.</td></tr>";
  } else {
    upcomingKeys.forEach(key => {
      upcomingGrouped[key].forEach(m => {
        upcomingHTML += "<tr>" +
          "<td>" + formatDate(m.date) + "</td>" +
          "<td>" + m.time + " " + getStatus(m.date, m.time) + "</td>" +
          "<td>" + m.series + "</td>" +
          "<td>" + m.home + "</td>" +
          "<td>" + m.away + "</td>" +
          "<td>" + hallWithLogo(m.arena) + "</td>" +
        "</tr>";
      });
    });
  }

  document.getElementById("upcomingBody").innerHTML = upcomingHTML;
  if (upcomingKeys.length > 10)
    document.getElementById("upcomingBody").classList.add("scrolling");

  document.getElementById("updatedInfo").textContent =
    "Senast uppdaterad: " + new Date().toLocaleString("sv-SE");
}

/* SPONSORS */
async function loadSponsors() {
  const apiUrl = "https://api.github.com/repos/SollentunaHC/matchskarm/contents/sponsors";
  const resp = await fetch(apiUrl);
  const files = await resp.json();
  const track = document.getElementById("sponsorTrack");

  const images = files.filter(f => f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i));
  const loopImages = images.concat(images);

  loopImages.forEach(img => {
    const el = document.createElement("img");
    el.src = img.download_url;
    track.appendChild(el);
  });
}

/* INIT */
loadMatches();
loadSponsors();
</script>
</body>
</html>
