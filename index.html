<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sollentuna Hockey – Arena Style 9.8 SHC</title>
  <meta http-equiv="refresh" content="300">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1a3a;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* SHC-draken som watermark */
    body::before {
      content: "";
      position: absolute;
      top: 20%;
      left: 50%;
      width: 600px;
      height: 600px;
      background: url('https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/shc_draken.png') no-repeat center;
      background-size: contain;
      opacity: 0.06;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    #clock {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      z-index: 1000;
    }

    header {
      text-align: center;
      padding: 25px 0 5px;
      font-size: 78px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      z-index: 10;
      position: relative;
    }

    h2 {
      text-align: center;
      font-size: 40px;
      font-weight: 900;
      margin-top: 5px;
      margin-bottom: 0px;
      color: #ffffff;
      z-index: 10;
      position: relative;
    }

    h2 + table {
      margin-top: -8px;
    }

    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      font-size: 26px;
      margin-top: 0;
      z-index: 10;
      position: relative;
    }

    th {
      background: #c62828;
      color: #fff;
      padding: 16px 10px;
      text-align: left;
      font-weight: 900;
      font-size: 30px;
    }

    td {
      padding: 16px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 26px;
      font-weight: 600;
    }

    tr:nth-child(even) { background: #1e2f5c; }
    tr:nth-child(odd)  { background: #14244a; }

    /* Highlight dagens match */
    .today-highlight {
      background: #b71c1c !important;
      color: #fff !important;
      font-weight: 900;
    }

    /* Serie-färgkodning */
    .serie-u16 { color: #ffeb3b; font-weight: 900; }
    .serie-u15 { color: #4caf50; font-weight: 900; }
    .serie-u14 { color: #29b6f6; font-weight: 900; }
    .serie-u13 { color: #ff9800; font-weight: 900; }
    .serie-default { color: #ffffff; }

    /* Rullning för kommande matcher */
    #upcomingBody.scrolling {
      display: block;
      height: 320px;
      overflow: hidden;
      animation: scrollUp 22s linear infinite;
    }

    @keyframes scrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    footer {
      text-align: right;
      font-size: 14px;
      opacity: 0.7;
      margin: 5px 40px 0;
      z-index: 10;
      position: relative;
    }

    .ad-bar {
      width: 100%;
      height: 10vh;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(6px);
      border-top: 3px solid rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 10;
    }

    .ad-track {
      display: flex;
      gap: 60px;
      white-space: nowrap;
      animation: scrollAds 35s linear infinite;
    }

    .ad-track img {
      height: 8vh;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
    }

    @keyframes scrollAds {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>

<body>

  <div id="clock"></div>

  <header>SOLLENTUNA HOCKEY</header>

  <div class="content-area">

    <h2>DAGENS MATCHER</h2>
    <table>
      <thead>
        <tr>
          <th>DATUM</th>
          <th>TID</th>
          <th>SERIE</th>
          <th>HEMMALAG</th>
          <th>BORTALAG</th>
          <th>HALL</th>
        </tr>
      </thead>
      <tbody id="todayMatchBody">
        <tr><td colspan="6">Laddar…</td></tr>
      </tbody>
    </table>

    <h2>KOMMANDE MATCHER</h2>
    <table>
      <thead>
        <tr>
          <th>DATUM</th>
          <th>TID</th>
          <th>SERIE</th>
          <th>HEMMALAG</th>
          <th>BORTALAG</th>
          <th>HALL</th>
        </tr>
      </thead>
      <tbody id="upcomingBody">
        <tr><td colspan="6">Laddar…</td></tr>
      </tbody>
    </table>

  </div>

  <footer id="updatedInfo"></footer>

  <div class="ad-bar">
    <div class="ad-track" id="sponsorTrack"></div>
  </div>
<script>
  function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  setInterval(updateClock, 1000);
  updateClock();

  async function loadMatches() {
    const url = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";

    const resp = await fetch(url);
    const text = await resp.text();

    const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
    const headers = lines[0].split(";");

    const idx = {
      Speldatum: headers.indexOf("Speldatum"),
      Tid: headers.indexOf("Tid"),
      Hemma: headers.indexOf("Hemma"),
      Borta: headers.indexOf("Borta"),
      Arena: headers.indexOf("Arena"),
      Serie: headers.indexOf("Serie")
    };

    let matches = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(";");

      // ENDAST Sollentuna som hemmalag
      if (!cols[idx.Hemma] || !cols[idx.Hemma].includes("Sollentuna")) continue;

      // Felsäker regex
      let cleanSerie = "";
      try {
        cleanSerie = cols[idx.Serie].toString().replace(/

\[[0-9]+\]

/g, "").trim();
      } catch {
        cleanSerie = cols[idx.Serie] ?? "";
      }

      matches.push({
        date: cols[idx.Speldatum],
        time: cols[idx.Tid],
        series: cleanSerie,
        home: cols[idx.Hemma],
        away: cols[idx.Borta],
        arena: cols[idx.Arena]
      });
    }

    matches.sort((a, b) => {
      if (a.date === b.date) return a.time.localeCompare(b.time);
      return a.date.localeCompare(b.date);
    });

    const today = new Date().toISOString().split("T")[0];

    const todayMatch = matches.filter(m => m.date === today);

    // Grupp efter datum
    const grouped = {};
    matches.forEach(m => {
      if (!grouped[m.date]) grouped[m.date] = [];
      grouped[m.date].push(m);
    });

    // Max 5 datum
    const nextDates = Object.keys(grouped).filter(d => d > today).slice(0, 5);

    // Platta ut matcherna
    const upcoming = nextDates.flatMap(d => grouped[d]);

    // Serie-färgkodning
    function serieClass(serie) {
      const s = serie.toLowerCase();
      if (s.includes("u16")) return "serie-u16";
      if (s.includes("u15")) return "serie-u15";
      if (s.includes("u14")) return "serie-u14";
      if (s.includes("u13")) return "serie-u13";
      return "serie-default";
    }

    // Dagens matcher
    document.getElementById("todayMatchBody").innerHTML =
      todayMatch.length === 0
        ? "<tr><td colspan='6'>Ingen hemmamatch idag.</td></tr>"
        : todayMatch.map(m => `
          <tr class="today-highlight">
            <td>${m.date}</td>
            <td>${m.time}</td>
            <td class="${serieClass(m.series)}">${m.series}</td>
            <td>${m.home}</td>
            <td>${m.away}</td>
            <td>${m.arena}</td>
          </tr>
        `).join("");

    // Kommande matcher
    document.getElementById("upcomingBody").innerHTML =
      upcoming.length === 0
        ? "<tr><td colspan='6'>Inga kommande hemmamatcher.</td></tr>"
        : upcoming.map(m => `
          <tr>
            <td>${m.date}</td>
            <td>${m.time}</td>
            <td class="${serieClass(m.series)}">${m.series}</td>
            <td>${m.home}</td>
            <td>${m.away}</td>
            <td>${m.arena}</td>
          </tr>
        `).join("");

    // Aktivera rullning om fler än 10 matcher
    if (upcoming.length > 10) {
      document.getElementById("upcomingBody").classList.add("scrolling");
    }

    document.getElementById("updatedInfo").textContent =
      "Senast uppdaterad: " + new Date().toLocaleString("sv-SE");
  }

  loadMatches();

  async function loadSponsors() {
    const apiUrl = "https://api.github.com/repos/SollentunaHC/matchskarm/contents/sponsors";

    const resp = await fetch(apiUrl);
    const files = await resp.json();

    const track = document.getElementById("sponsorTrack");

    const images = files.filter(f =>
      f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i)
    );

    const loopImages = [...images, ...images];

    loopImages.forEach(img => {
      const el = document.createElement("img");
      el.src = img.download_url;
      track.appendChild(el);
    });
  }

  loadSponsors();
</script>

</body>
</html>
