<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="300"> <!-- Auto-refresh var 5:e minut -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sollentuna Hockey – Matchskärm</title>

<style>
    body {
        margin: 0;
        background: #ffffff;
        font-family: Arial, sans-serif;
        color: #000;
    }

    header {
        background: #002f6c; /* SHC blå */
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 48px;
        font-weight: bold;
    }

    .section-title {
        font-size: 36px;
        margin: 40px 0 10px 20px;
        font-weight: bold;
        color: #002f6c;
    }

    .match-list {
        margin: 0 20px;
        font-size: 32px;
    }

    .match {
        padding: 20px;
        border-bottom: 2px solid #ddd;
    }

    .match strong {
        color: #c8102e; /* SHC röd */
    }
</style>
</head>

<body>

<header>DAGENS MATCHER</header>

<div id="today" class="match-list">Laddar...</div>

<div class="section-title">KOMMANDE MATCHER</div>
<div id="upcoming" class="match-list">Laddar...</div>

<script>
// ===============================
// 1. HÄMTA DATA FRÅN EXCEL ONLINE
// ===============================

const excelUrl = "https://sollentunahc-my.sharepoint.com/:x:/g/personal/gunnar_sollentunahockey_com/IQA6KPTEYK18S6O_-x8bORm9AUh4lXec4DJBTAatnSAt86w?download=1";

async function fetchExcelData() {
    try {
        const response = await fetch(excelUrl);
        const text = await response.text();

        // Dela på rad + semikolon
        const rows = text.trim().split("\n").map(r => r.split(";"));

        return rows.slice(1); // hoppa över header
    } catch (e) {
        console.error("Fel vid hämtning:", e);
        return [];
    }
}

// ===============================
// 2. DATUMHANTERING
// ===============================

// Konvertera "25-jun" → Date‑objekt
function parseDate(dateStr) {
    const months = {
        "jan": 0, "feb": 1, "mar": 2, "apr": 3, "maj": 4, "jun": 5,
        "jul": 6, "aug": 7, "sep": 8, "okt": 9, "nov": 10, "dec": 11
    };

    const [day, mon] = dateStr.split("-");
    const monthIndex = months[mon.toLowerCase()];
    const year = new Date().getFullYear();

    return new Date(year, monthIndex, parseInt(day));
}

function isToday(dateStr) {
    const d = parseDate(dateStr);
    const today = new Date();

    return d.getFullYear() === today.getFullYear() &&
           d.getMonth() === today.getMonth() &&
           d.getDate() === today.getDate();
}

function isUpcoming(dateStr) {
    const d = parseDate(dateStr);
    const today = new Date();
    return d > today;
}

// ===============================
// 3. VISA MATCHER
// ===============================

function renderMatches(matches, containerId) {
    const container = document.getElementById(containerId);
    if (matches.length === 0) {
        container.innerHTML = "<div class='match'>Inga matcher</div>";
        return;
    }

    container.innerHTML = matches.map(m => `
        <div class="match">
            <strong>${m[2]}</strong> vs <strong>${m[3]}</strong><br>
            ${m[0]} – ${m[1]}<br>
            Hall: ${m[4]}
        </div>
    `).join("");
}

// ===============================
// 4. HUVUDFUNKTION
// ===============================

async function loadMatches() {
    const data = await fetchExcelData();

    const todayMatches = data.filter(m => isToday(m[0]));
    const upcomingMatches = data
        .filter(m => isUpcoming(m[0]))
        .sort((a, b) => parseDate(a[0]) - parseDate(b[0]))
        .slice(0, 10);

    renderMatches(todayMatches, "today");
    renderMatches(upcomingMatches, "upcoming");
}

loadMatches();
</script>

</body>
</html>
