<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Sollentuna Hockey – Matchskärm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --shc-blue: #001633;
            --shc-blue-dark: #000d20;
            --shc-red: #c8102e;
            --shc-white: #ffffff;
            --shc-grey: #cccccc;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #002b5c 0%, #000814 55%, #000000 100%);
            color: var(--shc-white);
            overflow: hidden;
        }

        .page {
            padding: 20px 30px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .clock {
            font-size: 32px;
            font-weight: 600;
        }

        .sections {
            margin-top: 15px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .section {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid var(--shc-red);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .section-header {
            background: linear-gradient(90deg, var(--shc-red), #ff3b3b);
            padding: 6px 14px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .table-wrapper {
            padding: 10px 14px;
            height: calc(100% - 40px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        th {
            color: var(--shc-grey);
            font-size: 16px;
            font-weight: 700;
            padding-bottom: 4px;
        }

        td {
            padding: 4px 6px;
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.03);
        }

        .today-row {
            background: rgba(200, 16, 46, 0.25);
        }

        .watermark {
            position: absolute;
            right: 2%;
            bottom: -10%;
            width: 40%;
            opacity: 0.06;
            pointer-events: none;
        }
    </style>
</head>

<body>
<div class="page">

    <div class="header">
        <div class="title">SOLLENTUNA HOCKEY</div>
        <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="sections">

        <div class="section">
            <div class="section-header">DAGENS MATCHER</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th>DATUM</th>
                        <th>TID</th>
                        <th>SERIE</th>
                        <th>HEMMALAG</th>
                        <th>BORTALAG</th>
                        <th>ARENA</th>
                    </tr>
                    </thead>
                    <tbody id="today-body">
                    <tr><td colspan="6">Laddar matcher...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <div class="section-header">KOMMANDE MATCHER</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th>DATUM</th>
                        <th>TID</th>
                        <th>SERIE</th>
                        <th>HEMMALAG</th>
                        <th>BORTALAG</th>
                        <th>ARENA</th>
                    </tr>
                    </thead>
                    <tbody id="upcoming-body">
                    <tr><td colspan="6">Laddar matcher...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <img class="watermark" src="dragon.png" alt="SHC-draken">

</div>

<script>
    const DATA_URL = "DIN_CLOUDFLARE_WORKER_URL_HÄR";

    function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent =
            now.toLocaleTimeString("sv-SE", { hour12: false });
    }

    function parseCSV(text) {
        const lines = text.trim().split(/\r?\n/);
        const header = lines[0].split(";");

        const idx = {
            Datum: header.indexOf("Datum"),
            Tid: header.indexOf("Tid"),
            Serie: header.indexOf("Serie"),
            Hemma: header.indexOf("Hemmalag"),
            Borta: header.indexOf("Bortalag"),
            Arena: header.indexOf("Arena")
        };

        const matches = [];

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(";");

            const hemma = cols[idx.Hemma] || "";
            const borta = cols[idx.Borta] || "";

            if (!hemma.includes("Sollentuna") && !borta.includes("Sollentuna")) continue;

            const cleanSerie = (cols[idx.Serie] || "")
                .replace(/\s*\[\d+\]\s*/g, "")
                .replace(/\s*\(\d+\)\s*/g, "")
                .trim();

            matches.push({
                datum: cols[idx.Datum],
                tid: cols[idx.Tid],
                serie: cleanSerie,
                hemma,
                borta,
                arena: cols[idx.Arena] || ""
            });
        }

        return matches;
    }

    function isToday(dateStr) {
        const today = new Date().toISOString().slice(0, 10);
        return dateStr === today;
    }

    function render(matches) {
        const todayBody = document.getElementById("today-body");
        const upcomingBody = document.getElementById("upcoming-body");

        todayBody.innerHTML = "";
        upcomingBody.innerHTML = "";

        const today = matches.filter(m => isToday(m.datum));
        const upcoming = matches.filter(m => !isToday(m.datum));

        if (today.length === 0) {
            todayBody.innerHTML = `<tr><td colspan="6">Inga matcher idag.</td></tr>`;
        } else {
            today.forEach(m => {
                todayBody.innerHTML += `
                    <tr class="today-row">
                        <td>${m.datum}</td>
                        <td>${m.tid}</td>
                        <td>${m.serie}</td>
                        <td>${m.hemma}</td>
                        <td>${m.borta}</td>
                        <td>${m.arena}</td>
                    </tr>`;
            });
        }

        if (upcoming.length === 0) {
            upcomingBody.innerHTML = `<tr><td colspan="6">Inga kommande matcher.</td></tr>`;
        } else {
            upcoming.forEach(m => {
                upcomingBody.innerHTML += `
                    <tr>
                        <td>${m.datum}</td>
                        <td>${m.tid}</td>
                        <td>${m.serie}</td>
                        <td>${m.hemma}</td>
                        <td>${m.borta}</td>
                        <td>${m.arena}</td>
                    </tr>`;
            });
        }
    }

    async function loadMatches() {
        try {
            const res = await fetch(DATA_URL, { cache: "no-store" });
            const text = await res.text();
            render(parseCSV(text));
        } catch (err) {
            console.error("Fel vid hämtning:", err);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateClock();
        setInterval(updateClock, 1000);
        loadMatches();   // 🔥 Endast en gång – ingen 15s refresh
    });
</script>

</body>
</html>
