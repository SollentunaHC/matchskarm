<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sollentuna Hockey – Arena Style 9.2</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1a3a;
      color: #fff;
      overflow: hidden;
    }

    /* Klocka */
    #clock {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      z-index: 1000;
    }

    header {
      text-align: center;
      padding: 30px 0 10px;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }

    h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin: 10px 0;
      color: #ffffff;
    }

    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      font-size: 20px;
    }

    th {
      background: #c62828;
      color: #fff;
      padding: 10px;
      text-align: left;
      font-weight: 700;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    tr:nth-child(even) { background: #1e2f5c; }
    tr:nth-child(odd)  { background: #14244a; }

    /* Större rader för dagens matcher */
    .today-highlight td {
      font-size: 26px;
      padding: 16px;
      font-weight: 600;
      background: #1f3d7a;
      border-bottom: 2px solid rgba(255,255,255,0.25);
    }

    /* Kommande matcher – ingen scrollbar */
    .upcoming-box {
      height: 35vh;
      overflow: hidden;
    }

    footer {
      text-align: right;
      font-size: 12px;
      opacity: 0.7;
      margin: 10px 40px 20px;
    }

    /* Rullande reklambanner – max 10% höjd, ljus bakgrund */
    .ad-bar {
      width: 100%;
      height: 10vh;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(6px);
      border-top: 3px solid rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .ad-track {
      display: flex;
      gap: 60px;
      white-space: nowrap;
      animation: scrollAds 35s linear infinite;
    }

    .ad-track img {
      height: 8vh;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
    }

    @keyframes scrollAds {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <div id="clock"></div>

  <header>SOLLENTUNA HOCKEY</header>

  <h2>DAGENS MATCHER</h2>
  <table>
    <thead>
      <tr>
        <th>DATUM</th>
        <th>TID</th>
        <th>SERIE</th>
        <th>HEMMALAG</th>
        <th>BORTALAG</th>
        <th>HALL</th>
      </tr>
    </thead>
    <tbody id="todayMatchBody">
      <tr><td colspan="6">Laddar…</td></tr>
    </tbody>
  </table>

  <h2>KOMMANDE MATCHER</h2>
  <div class="upcoming-box">
    <table>
      <thead>
        <tr>
          <th>DATUM</th>
          <th>TID</th>
          <th>SERIE</th>
          <th>HEMMALAG</th>
          <th>BORTALAG</th>
          <th>HALL</th>
        </tr>
      </thead>
      <tbody id="upcomingBody">
        <tr><td colspan="6">Laddar…</td></tr>
      </tbody>
    </table>
  </div>

  <footer id="updatedInfo"></footer>

  <!-- RULLANDE SPONSORBANNER -->
  <div class="ad-bar">
    <div class="ad-track" id="sponsorTrack"></div>
  </div>

  <script>
    /* Klocka */
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* Hämta matcher */
    async function loadMatches() {
      const url = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";

      const resp = await fetch(url);
      const text = await resp.text();

      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      const headers = lines[0].split(";");

      const idx = {
        Speldatum: headers.indexOf("Speldatum"),
        Tid: headers.indexOf("Tid"),
        Hemma: headers.indexOf("Hemma"),
        Borta: headers.indexOf("Borta"),
        Arena: headers.indexOf("Arena"),
        Serie: headers.indexOf("Serie")
      };

      let matches = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(";");

        if (!cols[idx.Hemma] || !cols[idx.Hemma].includes("Sollentuna")) continue;

        matches.push({
          date: cols[idx.Speldatum],
          time: cols[idx.Tid],
          series: cols[idx.Serie],
          home: cols[idx.Hemma],
          away: cols[idx.Borta],
          arena: cols[idx.Arena]
        });
      }

      matches.sort((a, b) => new Date(a.date) - new Date(b.date));

      const today = new Date().toISOString().split("T")[0];
      const todayMatch = matches.filter(m => m.date === today);

      /* Sortera dagens matcher efter tid */
      todayMatch.sort((a, b) => a.time.localeCompare(b.time));

      const upcoming = matches.filter(m => m.date > today).slice(0, 10);

      document.getElementById("todayMatchBody").innerHTML =
        todayMatch.length === 0
          ? "<tr><td colspan='6'>Ingen hemmamatch idag.</td></tr>"
          : todayMatch.map(m => row(m, true)).join("");

      document.getElementById("upcomingBody").innerHTML =
        upcoming.length === 0
          ? "<tr><td colspan='6'>Inga kommande hemmamatcher.</td></tr>"
          : upcoming.map(m => row(m, false)).join("");

      document.getElementById("updatedInfo").textContent =
        "Senast uppdaterad: " + new Date().toLocaleString("sv-SE");
    }

    function row(m, highlight = false) {
      return `
        <tr class="${highlight ? 'today-highlight' : ''}">
          <td>${m.date}</td>
          <td>${m.time}</td>
          <td>${m.series}</td>
          <td>${m.home}</td>
          <td>${m.away}</td>
          <td>${m.arena}</td>
        </tr>`;
    }

    loadMatches();

    /* Hämta sponsorer från GitHub-mappen /sponsors */
    async function loadSponsors() {
      const apiUrl = "https://api.github.com/repos/SollentunaHC/matchskarm/contents/sponsors";

      const resp = await fetch(apiUrl);
      const files = await resp.json();

      const track = document.getElementById("sponsorTrack");

      const images = files.filter(f =>
        f.name.match(/\.(png|jpg|jpeg|svg|webp)$/i)
      );

      const loopImages = [...images, ...images];

      loopImages.forEach(img => {
        const el = document.createElement("img");
        el.src = img.download_url;
        track.appendChild(el);
      });
    }

    loadSponsors();
  </script>

</body>
</html>
