# Automatic U20 updates are included in laguppstallning.yml.
name: Uppdatera endast U20 manuellt
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shc-match-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-u20-lineup.py --force
      - run: python scripts/update-u20-player-info.py --force
      - name: Spara
        run: |
          git add u20/data.json u20/spelarinfo.json
          if ! git diff --cached --quiet; then
            git config user.name "SHC matchskärm"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Uppdatera U20"
            git pull --rebase origin main
            git push
          fi
