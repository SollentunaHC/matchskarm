name: Uppdatera laguppställning – A-lag, U20 och U18
on:
  workflow_dispatch:
  push:
    paths:
      - 'Spelschema_2627.csv'
      - 'nyindex_tizen.html'
      - 'scripts/**'
      - 'laguppstallning/spelarprofiler.json'
      - 'u20/spelarprofiler.json'
      - 'u18/spelarprofiler.json'
      - '.github/workflows/laguppstallning.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: shc-match-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta samtliga lag
        run: python scripts/update-all-teams.py ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Spara uppdatering även om en annan källa misslyckades
        if: always()
        run: |
          git add laguppstallning/data.json laguppstallning/spelarinfo.json u20/data.json u20/spelarinfo.json u18/data.json u18/spelarinfo.json
          if ! git diff --cached --quiet; then
            git config user.name "SHC matchskärm"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Uppdatera A-lag, U20 och U18"
            git pull --rebase origin main
            git push
          fi
