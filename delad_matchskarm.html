<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="600"><title>Sollentuna Hockey – delad matchskärm</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#08132b}.shared-screen{position:fixed;inset:0;width:100vw;height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#273c68,#0b1732 60%);overflow:hidden;color:#fff}.shared-header{height:14vh;flex:0 0 14vh;display:flex;align-items:center;margin:0 2.5vw;padding:1vh 0;border-bottom:1px solid #456080}.shared-clock{width:25%;text-align:center;display:flex;flex-direction:column;gap:.4vh}.shared-clock strong{font-size:2.8vw;font-weight:900;line-height:1}.shared-clock span{font-size:1.1vw;color:#c1cde4;font-weight:800;text-transform:capitalize}.shared-brand{width:50%;text-align:center}.shared-brand small{font-size:.85vw;letter-spacing:.35em;font-weight:800;color:#c1d6f6}.shared-brand h1{font-size:3.45vw;letter-spacing:.075em;line-height:1.1;margin:.8vh 0 0;white-space:nowrap;font-weight:900}.shared-brand i{display:block;height:3px;width:60%;margin:.8vh auto 0;background:linear-gradient(90deg,transparent,#df283b,transparent)}.shared-update{width:25%;text-align:right;align-self:flex-start;padding-top:1.2vh;font-size:.9vw;color:#c1cde4;font-weight:800}.shared-checks{display:flex;justify-content:flex-end;gap:.4vw;margin-top:.6vh}.shared-checks b{display:flex;align-items:center;justify-content:center;width:1.8vw;height:2.8vh;border:1px solid #a6bddb;border-radius:3px;font-size:1.1vw}.shared-checks .ok{color:#58d892;border-color:#58d892}.shared-checks .error{color:#ff5366;border-color:#ff5366}.shared-panels{display:flex;flex:1;min-height:0;padding:1vh 1.5vw;gap:0}.shared-panels iframe{display:block;flex:0 0 50%;width:50%;height:100%;border:0;background:#08132b;min-width:0}.shared-panels iframe+iframe{border-left:2px solid #456080}.shared-sponsors{height:12vh;flex:0 0 12vh;background:#fff;border-top:4px solid #d2242b;display:flex;align-items:center;position:relative;color:#091a37}.shared-sponsor-label{align-self:stretch;display:flex;align-items:center;background:#e7ecf4;padding:0 1.4vw;flex:none;font-size:.8vw;font-weight:900;letter-spacing:.12em}.shared-sponsor-window{flex:1;min-width:0;overflow:hidden}.shared-sponsor-track{display:flex;width:max-content;animation:shared-roll 51s linear infinite}.shared-sponsor-group{display:flex;flex:none}.shared-sponsor-item{width:16vw;height:11vh;flex:0 0 16vw;display:flex;align-items:center;justify-content:center}.shared-sponsor-item img{max-width:12vw;max-height:8vh;object-fit:contain}.shared-signature{position:absolute;right:.5vw;bottom:.3vh;font-size:.7vw;padding:.2vh .3vw;background:#ffffffd9;color:#182b45}.sponsor-loading{font-size:1.2vw;padding:2vw}@keyframes shared-roll{to{transform:translateX(-50%)}}
</style></head><body><div class="shared-screen"><header class="shared-header"><div class="shared-clock"><strong id="clock">–</strong><span id="date"></span></div><div class="shared-brand"><small>SEDAN 1976</small><h1>SOLLENTUNA HOCKEY</h1><i></i></div><div class="shared-update"><span id="updated">Hämtar spelschema…</span><div class="shared-checks" id="checks"></div></div></header><div class="shared-panels"><iframe id="arena" src="arena_panel.html" title="Sollentunas matcher"></iframe><iframe id="ettan" src="hockeyettan_norra.html" title="Hockeyettan Norra live"></iframe></div><div class="shared-sponsors"><div class="shared-sponsor-label">VÅRA PARTNERS</div><div class="shared-sponsor-window"><div class="shared-sponsor-track" id="sponsors"></div></div><span class="shared-signature">G. Olsson 2026</span></div></div><script>
(function(){
function clock(){var now=new Date();document.getElementById('clock').textContent=now.toLocaleTimeString('sv-SE',{timeZone:'Europe/Stockholm'});document.getElementById('date').textContent=now.toLocaleDateString('sv-SE',{timeZone:'Europe/Stockholm',weekday:'long',day:'numeric',month:'long',year:'numeric'});}
clock();setInterval(clock,1000);
window.addEventListener('message',function(event){if(event.origin!==location.origin||!event.data||event.data.type!=='arena-update')return;document.getElementById('updated').textContent=event.data.info||'';var checks=event.data.checks||[];var holder=document.getElementById('checks');holder.innerHTML='';for(var i=0;i<checks.length;i++){var c=checks[i]||{};var b=document.createElement('b');b.className=c.ok?'ok':c.error?'error':'';b.textContent=c.text||'–';holder.appendChild(b);}});
function sponsors(){var xhr=new XMLHttpRequest();xhr.open('GET','https://sollentunahc.github.io/matchskarm/sponsors/list.txt?t='+Date.now(),true);xhr.timeout=15000;xhr.onload=function(){if(xhr.status!==200)return;var names=xhr.responseText.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(name){return /\.(png|jpg|jpeg|svg|webp)$/i.test(name.trim())});if(!names.length)return;var track=document.getElementById('sponsors');track.innerHTML='';track.style.animationDuration=Math.max(30,names.length*3)+'s';for(var copy=0;copy<2;copy++){var group=document.createElement('div');group.className='shared-sponsor-group';for(var i=0;i<names.length;i++){var item=document.createElement('div');item.className='shared-sponsor-item';var img=document.createElement('img');img.src='https://sollentunahc.github.io/matchskarm/sponsors/'+encodeURIComponent(names[i].trim());img.alt=names[i].replace(/\.[^.]+$/,'');item.appendChild(img);group.appendChild(item);}track.appendChild(group);}};xhr.send();}
sponsors();setInterval(sponsors,300000);
setInterval(function(){document.getElementById('arena').src='arena_panel.html?t='+Date.now()},300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)clock();});
})();</script></body></html>
