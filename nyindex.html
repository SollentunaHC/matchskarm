<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sollentuna Hockey – Arenaskärm Live 13.0</title>

  <style>
    :root {
      --navy-950: #06132d;
      --navy-900: #0a1c3f;
      --navy-800: #102958;
      --navy-700: #17366e;
      --red: #d2242b;
      --red-dark: #a8171e;
      --white: #ffffff;
      --muted: #b9c7df;
      --line: rgba(255, 255, 255, 0.12);
      --glass: rgba(10, 28, 63, 0.84);
      --home: #ffffff;
      --away: #ffffff;
      --soon: #ffd447;
      --live: #46d17d;
      --neon-yellow: #ffff33;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--white);
      font-family: "Segoe UI", Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 5%, rgba(46, 84, 150, 0.56), transparent 38%),
        linear-gradient(150deg, var(--navy-950) 0%, var(--navy-900) 50%, #07172f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(110deg, transparent 0 47%, rgba(255,255,255,.025) 47% 49%, transparent 49% 100%),
        repeating-linear-gradient(0deg, transparent 0 42px, rgba(255,255,255,.018) 43px 44px);
    }

    body::after {
      content: "";
      position: fixed;
      width: min(48vw, 760px);
      aspect-ratio: 1;
      top: 12vh;
      left: 50%;
      transform: translateX(-50%);
      background: url("https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/shc_draken.png") center/contain no-repeat;
      opacity: .055;
      pointer-events: none;
    }

    /* Optimerad för liggande 16:9, exempelvis 1920 x 1080 */
    .screen {
      position: relative;
      z-index: 1;
      height: 89vh;
      padding: 1.8vh 2.6vw 1.2vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 1.4vh;
    }

    .topbar {
      min-height: 9.5vh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1.4vh;
    }

    .date-time { line-height: 1.05; }
    #clock { font-size: clamp(28px, 2.5vw, 52px); font-weight: 900; letter-spacing: .04em; }
    #todayDate { margin-top: .5vh; color: var(--muted); font-size: clamp(13px, 1.05vw, 22px); text-transform: capitalize; }

    .brand { text-align: center; }
    .brand-kicker { color: var(--muted); font-weight: 700; font-size: clamp(10px, .78vw, 16px); letter-spacing: .35em; }
    .brand-title { margin-top: .2vh; font-size: clamp(30px, 3.25vw, 66px); font-weight: 950; letter-spacing: .075em; line-height: 1; }
    .brand-line { width: 58%; height: 4px; margin: 1vh auto 0; border-radius: 99px; background: linear-gradient(90deg, transparent, var(--red), transparent); }

    .update { justify-self: end; text-align: right; color: var(--muted); font-size: clamp(10px, .8vw, 16px); line-height: 1.5; }
    .update strong { color: var(--white); }

    main {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 1.5vh;
    }

    .section {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(20,48,98,.82), rgba(7,24,54,.84));
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
      overflow: hidden;
    }

    .section-heading {
      height: 5.1vh;
      min-height: 40px;
      padding: 0 1.5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, var(--red-dark), var(--red) 48%, var(--red-dark));
      box-shadow: 0 4px 15px rgba(0,0,0,.18);
    }

    .section-heading h2 { margin: 0; font-size: clamp(17px, 1.45vw, 29px); letter-spacing: .08em; }
    .section-heading span { font-size: clamp(10px, .8vw, 16px); font-weight: 800; opacity: .84; letter-spacing: .12em; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { height: 3.7vh; padding: .45vh .75vw; color: var(--muted); border-bottom: 1px solid var(--line); font-size: clamp(10px, .78vw, 16px); letter-spacing: .12em; text-align: left; }
    td { height: 4.5vh; padding: .65vh .75vw; border-bottom: 1px solid rgba(255,255,255,.075); font-size: clamp(12px, 1.02vw, 21px); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,.025); }
    tbody tr { transition: background .2s ease; }

    .col-date { width: 12%; }
    .col-time { width: 12%; }
    .col-series { width: 20%; }
    .col-team { width: 18%; }
    .col-score { width: 11%; }
    .col-arena { width: 11%; }
    .center { text-align: center; }

    .today-section td { height: 5.6vh; font-size: clamp(14px, 1.18vw, 24px); }
    .today-section tbody tr { background: linear-gradient(90deg, rgba(210,36,43,.12), transparent 38%); }

    .shc-team {
      color: var(--neon-yellow);
      font-weight: 950;
      text-shadow: 0 0 7px rgba(255,255,51,.32);
    }
    .shc-team::before { content: ""; display: inline-block; width: 5px; height: 1.15em; margin-right: .5em; vertical-align: -.16em; border-radius: 4px; background: var(--red); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .35em;
      margin-left: .55em;
      padding: .25em .6em;
      border-radius: 999px;
      font-size: .66em;
      font-weight: 950;
      letter-spacing: .08em;
      vertical-align: .12em;
    }
    .status-soon { color: #241b00; background: var(--soon); }
    .status-live { color: #052513; background: var(--live); }
    .status-live::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: #087532; animation: pulse 1.2s ease-in-out infinite; }

    .score-cell { text-align: center; overflow: visible; }
    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4.5em;
      padding: .2em .55em;
      border-radius: 9px;
      color: var(--white);
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 1.18em;
      font-weight: 950;
      letter-spacing: .08em;
    }
    .score.live-score { color: #071d10; background: var(--live); border-color: var(--live); box-shadow: 0 0 16px rgba(70,209,125,.28); }
    .score-loading { color: var(--muted); font-size: .74em; letter-spacing: 0; }
    .live-detail { display: block; margin-top: .28em; color: var(--live); font-size: .58em; font-weight: 900; letter-spacing: .06em; }
    @keyframes pulse { 50% { transform: scale(.55); opacity: .55; } }

    .hall { display: inline-flex; align-items: center; gap: .55em; }
    .hall-logo { width: clamp(34px, 2.4vw, 52px); height: clamp(24px, 2.1vw, 46px); flex: 0 0 auto; background: url("https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/sponsors/Cyloq.png") center/contain no-repeat; }
    .empty { height: 7vh !important; color: var(--muted); text-align: center; font-style: italic; }

    .sponsor-bar {
      position: fixed;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      height: 11vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: rgba(255,255,255,.94);
      border-top: 5px solid var(--red);
      box-shadow: 0 -10px 30px rgba(0,0,0,.25);
    }
    .sponsor-label { align-self: stretch; flex: 0 0 auto; display: flex; align-items: center; padding: 0 1.4vw; color: var(--navy-900); background: #e7ecf4; font-size: clamp(10px, .72vw, 15px); font-weight: 900; letter-spacing: .12em; }
    .sponsor-window { min-width: 0; flex: 1; overflow: hidden; }
    .sponsor-track { width: max-content; display: flex; align-items: center; gap: 5vw; padding-left: 5vw; animation: sponsorScroll var(--scroll-duration, 42s) linear infinite; }
    .sponsor-track img { width: auto; height: 7.8vh; max-width: 12vw; object-fit: contain; }
    @keyframes sponsorScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    #versionTag { position: fixed; z-index: 6; right: .6vw; bottom: 11.4vh; color: rgba(255,255,255,.28); font-size: 9px; }

    @media (orientation: landscape) and (min-aspect-ratio: 16/10) {
      .topbar { grid-template-columns: 24% 52% 24%; }
      .section-heading { padding-inline: 1.3vw; }
      th, td { padding-left: .9vw; padding-right: .9vw; }
      .col-date { width: 11%; }
      .col-time { width: 11%; }
      .col-series { width: 19%; }
      .col-team { width: 19%; }
      .col-score { width: 10%; }
      .col-arena { width: 11%; }
    }

    @media (max-aspect-ratio: 4/3) {
      .screen { padding-inline: 2vw; }
      .update { display: none; }
      .topbar { grid-template-columns: 1fr auto 1fr; }
      .brand-title { letter-spacing: .035em; }
      .col-series { width: 20%; }
      .col-team { width: 21%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sponsor-track, .status-live::before { animation: none; }
    }
  </style>
</head>

<body>
  <div class="screen">
    <header class="topbar">
      <div class="date-time">
        <div id="clock">--:--:--</div>
        <div id="todayDate"></div>
      </div>

      <div class="brand">
        <div class="brand-kicker">SEDAN 1976</div>
        <div class="brand-title">SOLLENTUNA HOCKEY</div>
        <div class="brand-line"></div>
      </div>

      <div class="update">
        <strong>Automatisk matchinformation</strong><br>
        <span id="updatedInfo">Hämtar spelschema…</span>
      </div>
    </header>

    <main>
      <section class="section today-section">
        <div class="section-heading">
          <h2>DAGENS MATCHER</h2>
          <span>SOLLENTUNA HC</span>
        </div>
        <table aria-label="Dagens matcher">
          <thead><tr>
            <th class="col-date center">DATUM</th><th class="col-time center">TID</th><th class="col-series">SERIE</th>
            <th class="col-team">HEMMALAG</th><th class="col-team">BORTALAG</th><th class="col-score center">RESULTAT</th><th class="col-arena">HALL</th>
          </tr></thead>
          <tbody id="todayMatchBody"><tr><td class="empty" colspan="7">Laddar matcher…</td></tr></tbody>
        </table>
      </section>

      <section class="section upcoming-section">
        <div class="section-heading">
          <h2>KOMMANDE MATCHER</h2>
          <span>NÄSTA 6 MATCHER</span>
        </div>
        <table aria-label="Kommande matcher">
          <thead><tr>
            <th class="col-date center">DATUM</th><th class="col-time center">TID</th><th class="col-series">SERIE</th>
            <th class="col-team">HEMMALAG</th><th class="col-team">BORTALAG</th><th class="col-arena">HALL</th>
          </tr></thead>
          <tbody id="upcomingBody"><tr><td class="empty" colspan="6">Laddar matcher…</td></tr></tbody>
        </table>
      </section>
    </main>
  </div>

  <aside class="sponsor-bar" aria-label="Sponsorer">
    <div class="sponsor-label">VÅRA PARTNERS</div>
    <div class="sponsor-window"><div class="sponsor-track" id="sponsorTrack"></div></div>
  </aside>
  <div id="versionTag"></div>

  <script>
    "use strict";

    const ARENA_VERSION = "Arena Style 13.2 – Cloudflare Live";
    const CSV_URL = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/Spelschema_2627.csv";
    const SPONSOR_LIST_URL = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/sponsors/list.txt";
    const SPONSOR_BASE_URL = "https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/sponsors/";
    const MAX_UPCOMING = 6;
    let activeTodayMatches = [];

    /*
      Om Swehockey blockerar direktanrop från webbläsaren anges adressen till
      en egen proxy här, exempelvis: "https://din-proxy.se/live?match=".
      Lämna tomt för att först försöka läsa Swehockey direkt.
    */
    const LIVE_RESULT_PROXY = "https://sollentuna-hockey-live.gunnar-127.workers.dev/live?match=";

    const htmlEscape = value => String(value ?? "").replace(/[&<>'"]/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    })[char]);

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString("sv-SE", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      document.getElementById("todayDate").textContent = now.toLocaleDateString("sv-SE", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    }

    function parseLocalDate(dateStr, timeStr = "00:00") {
      const dateParts = String(dateStr || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const timeParts = String(timeStr || "").match(/^(\d{1,2}):(\d{2})/);
      if (!dateParts || !timeParts) return null;
      const date = new Date(Number(dateParts[1]), Number(dateParts[2]) - 1, Number(dateParts[3]), Number(timeParts[1]), Number(timeParts[2]));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function dayStart(date = new Date()) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function formatDate(dateStr) {
      const date = parseLocalDate(dateStr);
      if (!date) return dateStr || "";
      return date.toLocaleDateString("sv-SE", { day: "numeric", month: "short" }).replace(".", "");
    }

    function getStatus(dateStr, timeStr) {
      const start = parseLocalDate(dateStr, timeStr);
      if (!start) return "";
      const minutesToStart = (start.getTime() - Date.now()) / 60000;
      if (minutesToStart > 0 && minutesToStart <= 60) return '<span class="status status-soon">SNART</span>';
      if (minutesToStart <= 0 && minutesToStart >= -150) return '<span class="status status-live">LIVE</span>';
      return "";
    }

    function hallWithLogo(arena) {
      const safeArena = htmlEscape(arena);
      if (!arena || !/^cyloq\b/i.test(arena.trim())) return safeArena;
      const suffix = htmlEscape(arena.replace(/^cyloq\s*/i, "").trim());
      return `<span class="hall"><span class="hall-logo" aria-label="CYLOQ"></span><span>${suffix}</span></span>`;
    }

    function parseCSVLine(line, delimiter = ";") {
      const values = [];
      let value = "";
      let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"' && quoted && line[i + 1] === '"') { value += '"'; i++; }
        else if (char === '"') quoted = !quoted;
        else if (char === delimiter && !quoted) { values.push(value.trim()); value = ""; }
        else value += char;
      }
      values.push(value.trim());
      return values;
    }

    function parseMatchesFromCSV(text) {
      const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(line => line.trim());
      if (lines.length < 2) return [];
      const headers = parseCSVLine(lines[0]);
      const column = name => headers.indexOf(name);
      const required = ["Speldatum", "Tid", "Hemma", "Borta", "Arena", "Serie"];
      if (required.some(name => column(name) < 0)) throw new Error("CSV-filen saknar en eller flera obligatoriska kolumner.");

      const matchNumberColumn = ["Matchnummer", "Matchnr", "MatchNr", "GameId", "GameID"]
        .map(name => column(name)).find(index => index >= 0);

      return lines.slice(1).map(line => {
        const cols = parseCSVLine(line);
        return {
          matchNumber: matchNumberColumn >= 0 ? (cols[matchNumberColumn] || "").replace(/\D/g, "") : "",
          date: cols[column("Speldatum")] || "",
          time: cols[column("Tid")] || "",
          home: cols[column("Hemma")] || "",
          away: cols[column("Borta")] || "",
          arena: cols[column("Arena")] || "",
          series: (cols[column("Serie")] || "").replace(/\[[0-9]+\]/g, "").trim()
        };
      }).filter(match => /sollentuna/i.test(match.home) || /sollentuna/i.test(match.away))
        .filter(match => parseLocalDate(match.date, match.time))
        .sort((a, b) => parseLocalDate(a.date, a.time) - parseLocalDate(b.date, b.time));
    }

    function splitMatches(matches) {
      const today = dayStart();
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      return {
        today: matches.filter(match => {
          const date = parseLocalDate(match.date, match.time);
          return date >= today && date < tomorrow;
        }),
        upcoming: matches.filter(match => parseLocalDate(match.date, match.time) >= tomorrow).slice(0, MAX_UPCOMING)
      };
    }

    function teamCell(team) {
      const className = /sollentuna/i.test(team) ? "shc-team" : "";
      return `<td class="${className}">${htmlEscape(team)}</td>`;
    }

    function resultCell(match, isToday) {
      if (!isToday || !match.matchNumber) return '<td class="score-cell"><span class="score">–</span></td>';
      return `<td class="score-cell" id="score-${htmlEscape(match.matchNumber)}"><span class="score score-loading">HÄMTAR…</span></td>`;
    }

    function matchRow(match, isToday = false) {
      return `<tr>
        <td class="center">${htmlEscape(formatDate(match.date))}</td>
        <td class="center">${htmlEscape(match.time)} ${getStatus(match.date, match.time)}</td>
        <td title="${htmlEscape(match.series)}">${htmlEscape(match.series)}</td>
        ${teamCell(match.home)}
        ${teamCell(match.away)}
        ${isToday ? resultCell(match, true) : ""}
        <td>${hallWithLogo(match.arena)}</td>
      </tr>`;
    }

    function renderMatches(targetId, matches, emptyMessage, isToday = false) {
      document.getElementById(targetId).innerHTML = matches.length
        ? matches.map(match => matchRow(match, isToday)).join("")
        : `<tr><td class="empty" colspan="${isToday ? 7 : 6}">${htmlEscape(emptyMessage)}</td></tr>`;
    }

    function parseLiveResult(html) {
      const documentCopy = new DOMParser().parseFromString(html, "text/html");
      const text = (documentCopy.body?.innerText || "").replace(/\s+/g, " ").trim();
      const preferredSelectors = [
        ".game-result", ".result", ".score", ".game-score",
        "[class*='gameResult']", "[class*='score']"
      ];
      let scoreMatch = null;
      for (const selector of preferredSelectors) {
        const candidate = documentCopy.querySelector(selector)?.textContent || "";
        scoreMatch = candidate.match(/(?:^|\D)(\d{1,2})\s*[-–]\s*(\d{1,2})(?:\D|$)/);
        if (scoreMatch) break;
      }
      if (!scoreMatch) scoreMatch = text.match(/(?:^|\D)(\d{1,2})\s*[-–]\s*(\d{1,2})(?:\D|$)/);
      if (!scoreMatch) return null;

      const periodMatch = text.match(/(?:period|prd|per\.?)[\s:]*(\d)/i);
      const timeMatch = text.match(/\b(\d{1,2}:\d{2})\b/);
      const ended = /slut|final|game ended|finished/i.test(text);
      const started = ended || /pågår|live|period|prd|nedsläpp/i.test(text);
      return {
        homeScore: Number(scoreMatch[1]),
        awayScore: Number(scoreMatch[2]),
        period: periodMatch ? Number(periodMatch[1]) : null,
        gameTime: timeMatch ? timeMatch[1] : "",
        status: ended ? "SLUT" : (started ? "LIVE" : "RESULTAT")
      };
    }

    async function fetchLiveResult(match) {
      const query = new URLSearchParams({
        match: match.matchNumber,
        date: match.date,
        home: match.home,
        away: match.away
      });
      const urls = [`${LIVE_RESULT_PROXY}${encodeURIComponent(match.matchNumber)}&${query.toString().replace(/^match=[^&]*&?/, "")}`];

      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const contentType = response.headers.get("content-type") || "";

          if (contentType.includes("application/json")) {
            const data = await response.json();
            if (typeof data.contents === "string") {
              const parsedContents = parseLiveResult(data.contents);
              if (parsedContents) return parsedContents;
            }
            const jsonResult = {
              homeScore: Number(data.homeScore ?? data.home_score),
              awayScore: Number(data.awayScore ?? data.away_score),
              period: data.period ?? null,
              gameTime: data.gameTime ?? data.game_time ?? "",
              status: data.status || "LIVE"
            };
            if (Number.isFinite(jsonResult.homeScore) && Number.isFinite(jsonResult.awayScore)) return jsonResult;
          } else {
            const htmlResult = parseLiveResult(await response.text());
            if (htmlResult) return htmlResult;
          }
          throw new Error("Inget resultat hittades i svaret.");
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("Resultatet kunde inte hämtas.");
    }

    function updateScoreCell(matchNumber, result) {
      const cell = document.getElementById(`score-${matchNumber}`);
      if (!cell) return;
      if (!result || !Number.isFinite(result.homeScore) || !Number.isFinite(result.awayScore)) {
        cell.innerHTML = '<span class="score">–</span>';
        return;
      }
      const live = String(result.status).toUpperCase() === "LIVE";
      const detail = [result.status, result.period ? `PERIOD ${result.period}` : "", result.gameTime]
        .filter(Boolean).join(" • ");
      cell.innerHTML = `<span class="score ${live ? "live-score" : ""}">${result.homeScore}–${result.awayScore}</span>${detail ? `<span class="live-detail">${htmlEscape(detail)}</span>` : ""}`;
    }

    async function loadLiveResults(todayMatches) {
      await Promise.all(todayMatches.filter(match => match.matchNumber).map(async match => {
        try {
          updateScoreCell(match.matchNumber, await fetchLiveResult(match));
        } catch (error) {
          console.warn(`Live-resultat saknas för match ${match.matchNumber}:`, error);
          updateScoreCell(match.matchNumber, null);
        }
      }));
    }

    async function loadMatches() {
      try {
        const response = await fetch(`${CSV_URL}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Kunde inte ladda spelschemat (${response.status}).`);
        const matches = parseMatchesFromCSV(await response.text());
        const grouped = splitMatches(matches);
        activeTodayMatches = grouped.today;
        renderMatches("todayMatchBody", grouped.today, "Inga matcher med Sollentuna HC idag.", true);
        renderMatches("upcomingBody", grouped.upcoming, "Inga kommande matcher är inlagda.");
        loadLiveResults(grouped.today);
        document.getElementById("updatedInfo").textContent = `Uppdaterad ${new Date().toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" })}`;
      } catch (error) {
        console.error(error);
        renderMatches("todayMatchBody", [], "Spelschemat kunde inte laddas.");
        renderMatches("upcomingBody", [], "Kontrollera internetanslutningen.");
        document.getElementById("updatedInfo").textContent = "Kunde inte uppdatera";
      }
    }

    async function loadSponsors() {
      try {
        const response = await fetch(`${SPONSOR_LIST_URL}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Kunde inte ladda sponsorer (${response.status}).`);
        const images = (await response.text()).replace(/^\uFEFF/, "").split(/\r?\n/)
          .map(name => name.trim()).filter(name => /\.(png|jpe?g|svg|webp)$/i.test(name));
        const track = document.getElementById("sponsorTrack");
        track.replaceChildren();
        if (!images.length) return;

        [...images, ...images].forEach(image => {
          const element = document.createElement("img");
          element.src = SPONSOR_BASE_URL + image.split("/").map(encodeURIComponent).join("/");
          element.alt = image.replace(/\.[^.]+$/, "");
          element.loading = "eager";
          track.appendChild(element);
        });
        track.style.setProperty("--scroll-duration", `${Math.max(34, images.length * 4.8)}s`);
      } catch (error) {
        console.error(error);
      }
    }

    function initArena() {
      document.getElementById("versionTag").textContent = ARENA_VERSION;
      updateClock();
      loadMatches();
      loadSponsors();
      setInterval(updateClock, 1000);
      setInterval(() => loadLiveResults(activeTodayMatches), 30000);
      setInterval(loadMatches, 300000);
      setInterval(loadSponsors, 1800000);
    }

    document.addEventListener("DOMContentLoaded", initArena);
  </script>
</body>
</html>
