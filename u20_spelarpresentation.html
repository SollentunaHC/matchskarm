<script>
(function(){
'use strict';
var params=new URLSearchParams(location.search),local=location.hostname==='localhost'||location.hostname==='127.0.0.1';
var base=local?'./':'https://raw.githubusercontent.com/SollentunaHC/matchskarm/main/';
var dragon=new URL('drake.png',location.href).href,players=[],photos={},profileIndex=0,busy=false;
if(params.get('kiosk')==='1')document.body.classList.add('kiosk');
function byId(id){return document.getElementById(id)}
function el(tag,cls,value){var node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node}
function clear(id){var node=byId(id);while(node.firstChild)node.removeChild(node.firstChild);return node}
function display(value){return value===null||value===undefined||value===''?'—':String(value)}
function key(name){return name.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim()}
function message(value){byId('status').textContent=value;byId('status').classList.toggle('show',Boolean(value))}
function size(){var box=document.querySelector('.viewport'),scale=Math.min(box.clientWidth/1920,box.clientHeight/1080);document.querySelector('.frame').style.width=1920*scale+'px';document.querySelector('.frame').style.height=1080*scale+'px';document.querySelector('.screen').style.transform='scale('+scale+')'}
function photo(player){var image=el('img','profile-photo');image.alt='';image.src=player.number?new URL(photos[key(player.name)]||photos[player.number]||'u20/spelarfoton/'+key(player.name).replace(/ /g,'-')+'.jpg',location.href).href:dragon;image.onerror=function(){image.onerror=null;image.src=dragon};return image}
function render(){
var panel=clear('presentation');
if(!players.length){panel.appendChild(el('h2','profile-name','Väntar på spelaruppgifter'));size();return}
profileIndex=((profileIndex%players.length)+players.length)%players.length;var player=players[profileIndex];
var side=el('div');side.appendChild(photo(player));side.appendChild(el('div','profile-number',player.number?'#'+player.number:'—'));side.appendChild(el('div','profile-counter','Spelare '+(profileIndex+1)+' av '+players.length));panel.appendChild(side);
var detail=el('div');detail.appendChild(el('h2','profile-name',player.name));var bio=el('div','profile-bio');
[['Födelseår',player.birthYear],['Moderförening',player.youthTeam],['Spelade 2025–2026',player.previousTeams&&player.previousTeams.length?player.previousTeams.join(' · '):null]].forEach(function(pair){var group=el('div');group.appendChild(el('span','label',pair[0]));group.appendChild(el('span',null,display(pair[1])));bio.appendChild(group)});detail.appendChild(bio);
var stats=el('div','profile-stats');[['Matcher · GP','GP'],['Mål · G','G'],['Assist · A','A'],['Poäng · TP','TP']].forEach(function(pair){var item=el('div','profile-stat');item.appendChild(el('div','profile-stat-label',pair[0]));item.appendChild(el('div','profile-stat-value',display(player.stats&&player.stats[pair[1]])));stats.appendChild(item)});detail.appendChild(stats);detail.appendChild(el('div','profile-note','Sollentuna HC · U20 Nationell · 2026–2027'));panel.appendChild(detail);byId('player-select').value=String(profileIndex);size();
}
function options(){var select=clear('player-select');players.forEach(function(player,index){var option=el('option',null,(player.number?'#'+player.number+' · ':'')+player.name);option.value=String(index);select.appendChild(option)})}
async function json(path){var response=await fetch(base+path+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}
async function load(){if(busy)return;busy=true;try{
var values=await Promise.all([json('u20/spelarprofiler.json'),json('u20/spelarinfo.json').catch(function(){return null})]);var profiles=values[0],info=values[1];
if(profiles.season!=='2026-2027'||!Array.isArray(profiles.players)||!profiles.players.length)throw new Error('Ogiltiga spelarprofiler');
var records=info&&info.season===profiles.season&&Array.isArray(info.players)?info.players:[];
var seen={};var selectedName=players[profileIndex]&&key(players[profileIndex].name);
players=profiles.players.map(function(profile){var name=key(profile.name);if(seen[name])throw new Error('Spelaridentiteten behöver verifieras');seen[name]=true;var matches=records.filter(function(record){return key(record.name)===name});var record=matches.length===1?matches[0]:{};return Object.assign({},record,profile,{stats:record.stats||null,number:record.number||profile.number||null})});
players.sort(function(a,b){return Number(a.number||999)-Number(b.number||999)||a.name.localeCompare(b.name,'sv')});
var retained=players.findIndex(function(player){return key(player.name)===selectedName});if(retained>=0)profileIndex=retained;
options();render();message(!info?'Spelarprofiler visas. Statistik kunde inte hämtas.':info.status==='error'?'Visar tidigare statistik. Senaste uppdateringen misslyckades.':'');
byId('updated').textContent=info&&info.updatedAt?'Statistik uppdaterad '+new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(info.updatedAt)):'';
}catch(error){message(players.length?'Ingen anslutning. Visar senast hämtade spelaruppgifter.':'Spelaruppgifterna kunde inte hämtas. Försöker igen automatiskt.');if(!players.length)render()}finally{busy=false}}
byId('player-select').addEventListener('change',function(){profileIndex=Number(this.value);render()});byId('prev').addEventListener('click',function(){profileIndex--;render()});byId('next').addEventListener('click',function(){profileIndex++;render()});
byId('fullscreen').addEventListener('click',function(){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen()});
window.addEventListener('resize',size);document.addEventListener('fullscreenchange',size);render();load();setInterval(load,120000);setInterval(function(){profileIndex++;render()},4000);
json('u20/spelarfoton.json').then(function(map){photos=map;render()}).catch(function(){});
})();
