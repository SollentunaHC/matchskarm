<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="600"><title>HOCKEYETTAN NORRA live</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1a30;color:white;font-family:Arial,Helvetica,sans-serif}body{padding:1.2vh 2vw;display:flex;flex-direction:column}.title{height:6.5vh;background:#173b67;display:flex;align-items:center;justify-content:space-between;padding:1vh 1.5vw;font-size:2.6vw;font-weight:900;flex:none}.title small{font-size:1.7vw}.columns,.match{display:grid;grid-template-columns:17% 33% 17% 33%;align-items:center}.columns{font-size:1.3vw;color:#9db4d1;padding:1.5vh 1.3vw;letter-spacing:.03em}.columns span:nth-child(3){text-align:center}#games{display:flex;flex-direction:column;flex:1;min-height:0;gap:1vh}.match{flex:1;min-height:0;padding:1.2vh 1.3vw;border:1px solid #29415e;border-radius:.4vw;background:#152942}.shc{border-left:.5vw solid #ed3b52;background:#203d61}.status{font-size:2.1vw;font-weight:800}.home,.away{font-size:2.45vw;font-weight:800;line-height:1.15}.away{padding-left:.8vw}.home small,.status small{display:block;font-size:1.4vw;color:#a8bfd9;margin-top:.5vh;font-weight:normal}.score{text-align:center;font-size:3.5vw;font-weight:900;white-space:nowrap}.number{display:inline-block;min-width:3vw;border-radius:.3vw;padding:.3vh .35vw}.marked{background:#ffcd38;color:#081323}.goal-team{color:#ffda66}.goal-label{display:block;color:#ffda66;font-size:1.2vw;line-height:1.2;white-space:normal}.goal-label small{display:block;color:#c7d6e7;font-size:1.1vw}.fresh{border-color:#ffcd38;animation:flash 1.5s ease-in-out 6}@keyframes flash{50%{background:#4a4524}}.empty{margin:auto;font-size:3vw;font-weight:bold}#last{font-size:1.2vw;color:#9fb4ce;padding-top:1vh;min-height:2.5vh}.playing{color:#55e8af}@media(prefers-reduced-motion:reduce){.fresh{animation:none}}</style></head><body><div class="title">HOCKEYETTAN NORRA<small>DAGENS MATCHER</small></div><div class="columns"><span>STATUS</span><span>HEMMALAG</span><span>RESULTAT</span><span>BORTALAG</span></div><div id="games"><div class="empty">Hämtar dagens matcher…</div></div><div id="last"></div><script>
(function(){var data=null,marks={},busy=false,page=0;var lastOk=Date.now();
function key(g){return g.home+'|'+g.away}function score(s){var m=(s||'').match(/^(\d+)\s*[-–]\s*(\d+)$/);return m?[+m[1],+m[2]]:null}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){var d=new Date();try{var value=d.toLocaleDateString('sv-SE',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit'});if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value}catch(e){}function pad(n){return n<10?'0'+n:String(n)}return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function short(s){return s==='Asplöven Haparanda Hockey Förening'?'Asplöven Haparanda':s}
try{var saved=JSON.parse(localStorage.getItem('hockeyettan-native')||'null');if(saved&&saved.data&&saved.data.date===today()){marks=saved.marks||{};if(!data)data=saved.data;}}catch(e){}
function render(){var box=document.getElementById('games');if(!data||data.date!==today()){box.innerHTML='<div class="empty">Hämtar dagens matcher…</div>';return}var games=data.games||[];if(!games.length){box.innerHTML='<div class="empty">ingen match idag</div>';return}var pages=Math.max(1,Math.ceil(games.length/8));var start=(page%pages)*8,html='';for(var i=start;i<Math.min(start+8,games.length);i++){var g=games[i],m=marks[key(g)],s=score(g.score),fresh=m&&Date.now()-m.at<60000;var shc=g.home==='Sollentuna HC'||g.away==='Sollentuna HC';html+='<article class="match '+(shc?'shc ':'')+(fresh?'fresh':'')+'"><div class="status '+(g.status==='Pågår'?'playing':'')+'">'+esc(g.status==='Matchstart'?g.time:g.status)+'<small>'+esc(g.detail||(g.status==='Matchstart'?'Matchstart':''))+'</small></div><div class="home '+(m&&m.side==='home'?'goal-team':'')+'">'+esc(short(g.home))+'<small>'+esc(g.venue)+'</small></div><div class="score">';if(s){html+='<span class="number '+(m&&(m.side==='home'||m.side==='both')?'marked':'')+'">'+s[0]+'</span> – <span class="number '+(m&&(m.side==='away'||m.side==='both')?'marked':'')+'">'+s[1]+'</span>'}else html+='–';if(m)html+='<span class="goal-label">'+(m.side==='both'?'RESULTAT ÄNDRAT':fresh?'NYTT MÅL':'SENASTE MÅL')+'<small>Från '+esc(m.previous)+'</small></span>';html+='</div><div class="away '+(m&&m.side==='away'?'goal-team':'')+'">'+esc(short(g.away))+'</div></article>'}box.innerHTML=html;document.getElementById('last').textContent='Senast '+new Date(data.updatedAt).toLocaleTimeString('sv-SE',{timeZone:'Europe/Stockholm'})}
function receive(next){if(!next||!Array.isArray(next.games))throw Error('Felaktigt svar');if(!data||data.date!==next.date)marks={};else{for(var i=0;i<next.games.length;i++){var g=next.games[i],old=null;for(var j=0;j<data.games.length;j++)if(key(data.games[j])===key(g))old=data.games[j];if(!old||old.score===g.score)continue;var a=score(old.score)||[0,0],b=score(g.score);if(!b){delete marks[key(g)];continue}var h=b[0]-a[0],v=b[1]-a[1];if(h<0||v<0){delete marks[key(g)];continue}if(h>0||v>0)marks[key(g)]={side:h>0&&v>0?'both':h>0?'home':'away',at:Date.now(),previous:a.join(' – ')};}}data=next;lastOk=Date.now();try{localStorage.setItem('hockeyettan-native',JSON.stringify({data:data,marks:marks}))}catch(e){}render()}
function update(){if(busy)return;busy=true;var xhr=new XMLHttpRequest();xhr.open('GET','https://sollentuna-hockey-live.gunnar-127.workers.dev/matches?league=hockeyettan&t='+Date.now(),true);xhr.timeout=22000;function fail(){if(!data)document.getElementById('games').innerHTML='<div class="empty">Kunde inte hämta matcher</div>';document.getElementById('last').textContent='Uppdateringen misslyckades · försöker igen';busy=false}xhr.onload=function(){try{if(xhr.status!==200)throw Error();receive(JSON.parse(xhr.responseText));busy=false}catch(e){fail()}};xhr.onerror=fail;xhr.ontimeout=fail;xhr.send()}
try{render()}catch(e){document.getElementById('last').textContent='Kan inte visa ny uppdatering · försöker igen'}update();setInterval(update,30000);setInterval(function(){if(Date.now()-lastOk>120000)document.getElementById('last').textContent='Ingen ny uppdatering · försöker igen';},10000);setInterval(function(){page++;render()},12000);document.addEventListener('visibilitychange',function(){if(!document.hidden)update()});
})();</script></body></html>
